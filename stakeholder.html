<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 Stabil - Anti Hilang</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f6f7f9] min-h-screen"><div class="max-w-6xl mx-auto p-3 md:p-6"><div class="bg-white rounded-2xl shadow p-4 flex justify-between"><h1 class="font-bold">KDMP Kasih V6 STABIL</h1><button id="btnLogin" class="bg-black text-white px-3 py-1.5 rounded-lg text-sm">Login kasih123</button></div><div class="mt-4 bg-white rounded-2xl shadow p-2 flex gap-2 flex-wrap"><button data-tab="1" class="tabBtn flex-1 py-2 rounded-xl bg-black text-white font-semibold">Tab1</button><button data-tab="2" class="tabBtn flex-1 py-2 rounded-xl bg-gray-100">Tab2</button><button data-tab="3" class="tabBtn flex-1 py-2 rounded-xl bg-gray-100">Tab3</button><button data-tab="4" class="tabBtn flex-1 py-2 rounded-xl bg-gray-100">Tab4</button></div><div id="tab1" class="tabPanel mt-4 space-y-4"><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold">👥 Stakeholder Umum</h2><div id="publicStakeholder" class="mt-3 grid gap-3"></div></div><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold">📊 Desil No 1-10</h2><div id="publicDesil" class="mt-3 grid gap-3"></div></div><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold">💼 Pekerjaan</h2><div id="publicPekerjaan" class="mt-3 grid gap-3"></div></div><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold">🛒 Konsumen Detail</h2><div id="publicKonsumen" class="mt-3 grid gap-3"></div></div><div class="bg-white rounded-2xl shadow p-4"><h2 class="font-bold">🌾 Potensi</h2><div id="publicPotensi" class="mt-3 grid gap-3"></div></div></div><div id="tab2" class="tabPanel mt-4 hidden"><div class="bg-white rounded-2xl shadow p-4"><div class="flex justify-between"><h2 class="font-bold">Stakeholder</h2><button id="addStakeholderBtn" class="hidden bg-black text-white text-xs px-3 py-1 rounded">+ Tambah</button></div><div id="stakeholderList" class="mt-3 grid gap-3"></div><button onclick="copyStakeholder()" class="mt-4 w-full bg-gray-100 py-2 rounded-xl text-xs font-bold">📋 Copy di Bawah - Stakeholder</button></div></div><div id="tab3" class="tabPanel mt-4 hidden space-y-4"><div class="bg-white rounded-2xl shadow p-4"><div class="flex justify-between"><h2 class="font-bold">1) Desil - Edit Hapus per No</h2><button id="addDesilBtn" class="hidden bg-black text-white text-xs px-3 py-1 rounded">+ Tambah</button></div><div id="desilList" class="mt-3 grid gap-2"></div><button onclick="copyDesil()" class="mt-4 w-full bg-gray-100 py-2.5 rounded-xl text-xs font-bold">📋 Salin Data Desil di Bawah</button></div><div class="bg-white rounded-2xl shadow p-4"><div class="flex justify-between"><h2 class="font-bold">2) Pekerjaan per Alamat - Edit Hapus</h2><button id="addPekerjaanDataBtn" class="hidden bg-black text-white text-xs px-3 py-1 rounded">+ Tambah</button></div><div id="pekerjaanList" class="mt-3 grid gap-2"></div><button onclick="copyPekerjaan()" class="mt-4 w-full bg-gray-100 py-2.5 rounded-xl text-xs font-bold">📋 Salin Data Pekerjaan di Bawah</button></div><div class="bg-white rounded-2xl shadow p-4"><div class="flex justify-between"><h2 class="font-bold">3) Konsumen & Daya Serap - Edit Hapus</h2><button id="addKonsumenBtn" class="hidden bg-black text-white text-xs px-3 py-1 rounded">+ Tambah</button></div><div id="konsumenList" class="mt-3 grid gap-2"></div><button onclick="copyKonsumen()" class="mt-4 w-full bg-gray-100 py-2.5 rounded-xl text-xs font-bold">📋 Salin Data Konsumen di Bawah</button></div><div class="bg-white rounded-2xl shadow p-4"><div class="flex justify-between"><h2 class="font-bold">4) Potensi Desa - Edit Hapus</h2><button id="addPotensiBtn" class="hidden bg-black text-white text-xs px-3 py-1 rounded">+ Tambah</button></div><div id="potensiList" class="mt-3 grid gap-3"></div><button onclick="copyPotensi()" class="mt-4 w-full bg-gray-100 py-2.5 rounded-xl text-xs font-bold">📋 Salin Data Potensi di Bawah</button></div><div class="bg-white rounded-2xl shadow p-4"><button id="btnTampilAnalisis" class="bg-green-600 text-white text-sm px-3 py-1.5 rounded-lg">Hitung Analisis Bisnis</button><div id="analisisBox" class="hidden mt-4 bg-[#0f172a] text-white rounded-2xl p-5"><div id="analisisContent" class="text-sm leading-7"></div></div></div></div><div id="tab4" class="tabPanel mt-4 hidden"><div class="bg-white rounded-2xl shadow p-4"><div id="tab4Locked"><h2 class="font-bold">Login kasih123</h2></div><div id="tab4Content" class="hidden"><div class="grid gap-2 mt-3 text-sm"><input id="kop_nik" placeholder="NIK" class="border p-2 rounded"><input id="kop_nib" placeholder="NIB" class="border p-2 rounded"><input id="kop_sk" placeholder="SK" class="border p-2 rounded"><input id="kop_total" type="number" placeholder="Total" class="border p-2 rounded"><input id="kop_laki" type="number" placeholder="Laki" class="border p-2 rounded"><input id="kop_perempuan" type="number" placeholder="Perempuan" class="border p-2 rounded"><button id="saveKopdes" class="bg-black text-white px-3 py-2 rounded">Simpan</button><div id="kopRingkasan" class="mt-3 text-sm bg-gray-50 p-3 rounded"></div></div><h3 class="font-bold mt-6">Pengurus</h3><button id="addPengurusBtn" class="bg-black text-white text-xs px-3 py-1 rounded mt-2">+ Tambah</button><div id="pengurusList" class="mt-3 grid gap-3"></div><h3 class="font-bold mt-6">Pengawas</h3><button id="addPengawasBtn" class="bg-black text-white text-xs px-3 py-1 rounded mt-2">+ Tambah</button><div id="pengawasList" class="mt-3 grid gap-3"></div></div></div></div></div><div id="modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center p-3 z-50"><div class="bg-white rounded-2xl max-w-lg w-full p-4"><h3 id="modalTitle" class="font-bold"></h3><div id="modalBody" class="mt-3 grid gap-2"></div><div class="mt-4 flex justify-end gap-2"><button id="modalCancel" class="px-3 py-1.5 bg-gray-100 rounded-lg text-sm">Batal</button><button id="modalSave" class="px-3 py-1.5 bg-black text-white rounded-lg text-sm">Simpan</button></div></div></div><script>
const LS_KEY='kdmp_stable_final';
const OLD_KEYS=['kdmp_v3_final','kdmp_v4_final','kdmp_final','kdmp_v2_final','kdmp_v5_final'];
function getStored(){
 let cur=localStorage.getItem(LS_KEY);
 if(cur) return JSON.parse(cur);
 for(let k of OLD_KEYS){let v=localStorage.getItem(k); if(v){console.log('Migrasi dari',k); localStorage.setItem(LS_KEY,v); return JSON.parse(v);} }
 return null;
}
const defaultData={dusuns:['Kali Branjang','Lambegan','Dusun 3','Dusun 4'],rtrw:['RT 01/RW 01','RT 02/RW 01','RT 03/RW 01','RT 04/RW 02','RT 05/RW 02','RT 06/RW 03','RT 07/RW 03','RT 08/RW 04','RT 09/RW 04'],pekerjaans:['Petani','Buruh Tani','Pedagang'],stakeholders:[],desil:[],pekerjaanData:[],konsumenData:[],potensiData:[],kopdes:{nik:'',nib:'',sk:'',total:0,laki:0,perempuan:0},pengurus:[],pengawas:[]};
let stored=getStored();
let data=stored? {...defaultData,...stored}: JSON.parse(JSON.stringify(defaultData));
let isLogin=localStorage.getItem('kdmp_login')==='1';
function save(){localStorage.setItem(LS_KEY,JSON.stringify(data)); localStorage.setItem('kdmp_v3_final',JSON.stringify(data)); renderAll();}
function waLink(hp){let n=(hp||'').replace(/\D/g,'');if(n.startsWith('0'))n='62'+n.slice(1);return 'https://wa.me/'+n;}
function dusunOptions(v=''){return data.dusuns.map(d=>`<option ${d===v?'selected':''}>${d}</option>`).join('')}
function rtrwOptions(v=''){return data.rtrw.map(r=>`<option ${r===v?'selected':''}>${r}</option>`).join('')}
function renderTabs(){document.querySelectorAll('.tabBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.tabBtn').forEach(x=>x.className='tabBtn flex-1 py-2 rounded-xl bg-gray-100');b.className='tabBtn flex-1 py-2 rounded-xl bg-black text-white font-semibold';document.querySelectorAll('.tabPanel').forEach(p=>p.classList.add('hidden'));document.getElementById('tab'+b.dataset.tab).classList.remove('hidden');}})}
function renderAll(){
document.getElementById('publicStakeholder').innerHTML=data.stakeholders.filter(s=>s.status==='UMUM').map(s=>`<div class="border p-3 rounded-xl"><b>${s.nama}</b><div class="text-xs">${s.dusun} ${s.alamat}</div></div>`).join('')||'Belum ada';
document.getElementById('publicDesil').innerHTML=[...data.desil].sort((a,b)=>(a.no||0)-(b.no||0)).filter(d=>d.status==='UMUM').map(d=>`<div class="border p-3 rounded-xl"><span class="bg-black text-white text-xs px-2 py-1 rounded-full">No ${d.no}</span> ${d.desil} - ${d.jml} org<div class="text-xs">${d.alamat}</div></div>`).join('');
document.getElementById('publicPekerjaan').innerHTML=data.pekerjaanData.map(p=>`<div class="border p-3 rounded-xl"><b>${p.pekerjaan}</b> ${p.jml} org<div class="text-xs">${p.alamat}</div></div>`).join('');
document.getElementById('publicKonsumen').innerHTML=data.konsumenData.map(k=>`<div class="border p-3 rounded-xl"><b>${k.jenis}</b> ${k.jml} org Daya ${k.daya}<div class="text-xs">${k.alamat}</div></div>`).join('');
document.getElementById('publicPotensi').innerHTML=data.potensiData.map(p=>`<div class="border p-3 rounded-xl"><b>${p.komoditi}</b> ${p.volume} ${p.satuan}</div>`).join('');
document.getElementById('stakeholderList').innerHTML=data.stakeholders.map((s,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${s.nama}</b> ${s.jabatan}</div><div class="flex gap-1">${isLogin?`<button onclick="editStakeholder(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delStakeholder(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>`:''}</div></div>`).join('');
document.getElementById('desilList').innerHTML=[...data.desil].sort((a,b)=>(a.no||0)-(b.no||0)).map(d=>{let idx=data.desil.indexOf(d);return `<div class="border p-3 rounded-xl flex justify-between"><div><span class="bg-black text-white text-xs px-2 py-1 rounded-full">No ${d.no}</span> <b>${d.desil}</b> ${d.jml} org<div class="text-xs">${d.dusun} ${d.alamat}</div></div><div class="flex flex-col gap-1">${isLogin?`<button onclick="editDesil(${idx})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delDesil(${idx})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>`:''}</div></div>`}).join('');
document.getElementById('pekerjaanList').innerHTML=data.pekerjaanData.map((p,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${p.pekerjaan}</b> ${p.jml} org<div class="text-xs">${p.alamat} ${p.dusun}</div></div><div class="flex gap-1">${isLogin?`<button onclick="editPekerjaanData(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delPekerjaanData(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>`:''}</div></div>`).join('');
document.getElementById('konsumenList').innerHTML=data.konsumenData.map((k,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${k.jenis}</b> ${k.jml} org Daya ${k.daya} Frek ${k.frekuensi||'-'}<div class="text-xs">${k.alamat} Rp ${(k.omzet||k.jml*15000).toLocaleString()}</div></div><div class="flex gap-1">${isLogin?`<button onclick="editKonsumen(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delKonsumen(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>`:''}</div></div>`).join('');
document.getElementById('potensiList').innerHTML=data.potensiData.map((p,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${p.komoditi}</b> ${p.volume} ${p.satuan}<div class="text-xs">Luas ${p.luas} Ha SDM ${p.sdm} ${p.alamat}</div></div><div class="flex gap-1">${isLogin?`<button onclick="editPotensi(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delPotensi(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button>`:''}</div></div>`).join('');
if(!isLogin){document.getElementById('tab4Locked').classList.remove('hidden');document.getElementById('tab4Content').classList.add('hidden');}else{document.getElementById('tab4Locked').classList.add('hidden');document.getElementById('tab4Content').classList.remove('hidden');document.getElementById('kop_nik').value=data.kopdes.nik||'';document.getElementById('kop_nib').value=data.kopdes.nib||'';document.getElementById('kop_sk').value=data.kopdes.sk||'';document.getElementById('kop_total').value=data.kopdes.total||0;document.getElementById('kop_laki').value=data.kopdes.laki||0;document.getElementById('kop_perempuan').value=data.kopdes.perempuan||0;document.getElementById('kopRingkasan').innerHTML=`Total ${data.kopdes.total}`;document.getElementById('pengurusList').innerHTML=data.pengurus.map((p,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${p.nama}</b></div><div class="flex gap-1"><button onclick="editPengurus(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delPengurus(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button></div></div>`).join('');document.getElementById('pengawasList').innerHTML=data.pengawas.map((p,i)=>`<div class="border p-3 rounded-xl flex justify-between"><div><b>${p.nama}</b></div><div class="flex gap-1"><button onclick="editPengawas(${i})" class="text-xs bg-gray-100 px-2 py-1 rounded">Edit</button><button onclick="delPengawas(${i})" class="text-xs bg-red-50 px-2 py-1 rounded">Hapus</button></div></div>`).join('');}
document.getElementById('addStakeholderBtn').classList.toggle('hidden',!isLogin);document.getElementById('addDesilBtn').classList.toggle('hidden',!isLogin);document.getElementById('addPekerjaanDataBtn').classList.toggle('hidden',!isLogin);document.getElementById('addKonsumenBtn').classList.toggle('hidden',!isLogin);document.getElementById('addPotensiBtn').classList.toggle('hidden',!isLogin);document.getElementById('btnLogin').textContent=isLogin?'Logout':'Login';
}
function openModal(t,f,onSave){document.getElementById('modalTitle').textContent=t;let b=document.getElementById('modalBody');b.innerHTML=f.map(ff=>{if(ff.type==='select')return `<label class="text-xs font-semibold">${ff.label}</label><select id="${ff.id}" class="border p-2 rounded text-sm">${ff.options}</select>`;if(ff.type==='textarea')return `<label class="text-xs font-semibold">${ff.label}</label><textarea id="${ff.id}" class="border p-2 rounded text-sm">${ff.value||''}</textarea>`;return `<label class="text-xs font-semibold">${ff.label}</label><input id="${ff.id}" type="${ff.type||'text'}" value="${ff.value||''}" class="border p-2 rounded text-sm">`;}).join('');document.getElementById('modal').classList.remove('hidden');document.getElementById('modal').classList.add('flex');document.getElementById('modalSave').onclick=()=>{let vals={};f.forEach(ff=>vals[ff.id]=document.getElementById(ff.id).value);onSave(vals);closeModal();};}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
document.getElementById('modalCancel').onclick=closeModal;
window.editStakeholder=(i)=>{let s=data.stakeholders[i];openModal('Edit Stakeholder',[{id:'nama',label:'Nama',value:s.nama},{id:'jabatan',label:'Jabatan',value:s.jabatan},{id:'hp',label:'HP',value:s.hp},{id:'dusun',label:'Dusun',type:'select',options:dusunOptions(s.dusun)},{id:'rtrw',label:'RT/RW',type:'select',options:rtrwOptions(s.rtrw)},{id:'alamat',label:'Alamat',value:s.alamat},{id:'status',label:'Status',type:'select',options:`<option ${s.status==='UMUM'?'selected':''}>UMUM</option><option>PRIVACY</option>`}],v=>{data.stakeholders[i]={...s,...v};save();});};
window.delStakeholder=(i)=>{if(confirm('Hapus?')){data.stakeholders.splice(i,1);save();}};
document.getElementById('addStakeholderBtn').onclick=()=>{openModal('Tambah Stakeholder',[{id:'nama',label:'Nama'},{id:'jabatan',label:'Jabatan'},{id:'hp',label:'HP'},{id:'dusun',label:'Dusun',type:'select',options:dusunOptions()},{id:'rtrw',label:'RT/RW',type:'select',options:rtrwOptions()},{id:'alamat',label:'Alamat'},{id:'status',label:'Status',type:'select',options:'<option>UMUM</option><option>PRIVACY</option>'}],v=>{data.stakeholders.push(v);save();});};
window.editDesil=(i)=>{let d=data.desil[i];openModal('Edit Desil',[{id:'no',label:'No 1-10',type:'number',value:d.no},{id:'desil',label:'Nama Desil',value:d.desil},{id:'jml',label:'Jumlah',type:'number',value:d.jml},{id:'dusun',label:'Dusun',type:'select',options:dusunOptions(d.dusun)},{id:'rtrw',label:'RT/RW',type:'select',options:rtrwOptions(d.rtrw)},{id:'alamat',label:'Alamat',value:d.alamat}],v=>{v.no=parseInt(v.no)||1;v.jml=parseInt(v.jml)||0;data.desil[i]={...d,...v};save();});};
window.delDesil=(i)=>{if(confirm('Hapus?')){data.desil.splice(i,1);save();}};
document.getElementById('addDesilBtn').onclick=()=>{openModal('Tambah Desil',[{id:'no',label:'No Desil',type:'number'},{id:'desil',label:'Nama Desil',value:'Desil '},{id:'jml',label:'Jumlah',type:'number'},{id:'dusun',label:'Dusun',type:'select',options:dusunOptions()},{id:'rtrw',label:'RT/RW',type:'select',options:rtrwOptions()},{id:'alamat',label:'Alamat'}],v=>{v.no=parseInt(v.no)||data.desil.length+1;v.jml=parseInt(v.jml)||0;v.status='UMUM';data.desil.push(v);save();});};
window.editPekerjaanData=(i)=>{let d=data.pekerjaanData[i];openModal('Edit Pekerjaan',[{id:'pekerjaan',label:'Pekerjaan',value:d.pekerjaan},{id:'jml',label:'Jumlah',type:'number',value:d.jml},{id:'alamat',label:'Alamat',value:d.alamat}],v=>{v.jml=parseInt(v.jml)||0;data.pekerjaanData[i]={...d,...v};save();});};
window.delPekerjaanData=(i)=>{data.pekerjaanData.splice(i,1);save();};
document.getElementById('addPekerjaanDataBtn').onclick=()=>{openModal('Tambah Pekerjaan',[{id:'pekerjaan',label:'Pekerjaan'},{id:'jml',label:'Jumlah',type:'number'},{id:'dusun',label:'Dusun',type:'select',options:dusunOptions()},{id:'alamat',label:'Alamat'}],v=>{v.jml=parseInt(v.jml)||0;v.rtrw='RT 01/RW 01';data.pekerjaanData.push(v);save();});};
window.editKonsumen=(i)=>{let k=data.konsumenData[i];openModal('Edit Konsumen',[{id:'jenis',label:'Jenis',value:k.jenis},{id:'jml',label:'Jumlah',type:'number',value:k.jml},{id:'daya',label:'Daya',type:'select',options:`<option ${k.daya==='Tinggi'?'selected':''}>Tinggi</option><option>Sedang</option><option>Rendah</option>`},{id:'frekuensi',label:'Frekuensi',value:k.frekuensi},{id:'alamat',label:'Alamat',value:k.alamat}],v=>{v.jml=parseInt(v.jml)||0;v.omzet=v.jml*15000;data.konsumenData[i]={...k,...v};save();});};
window.delKonsumen=(i)=>{data.konsumenData.splice(i,1);save();};
document.getElementById('addKonsumenBtn').onclick=()=>{openModal('Tambah Konsumen',[{id:'jenis',label:'Jenis'},{id:'jml',label:'Jumlah',type:'number'},{id:'daya',label:'Daya',type:'select',options:'<option>Tinggi</option><option>Sedang</option><option>Rendah</option>'},{id:'frekuensi',label:'Frekuensi',value:'Mingguan'},{id:'alamat',label:'Alamat'}],v=>{v.jml=parseInt(v.jml)||0;v.omzet=v.jml*15000;v.dusun='Kali Branjang';v.rtrw='RT 01/RW 01';v.status='UMUM';data.konsumenData.push(v);save();});};
window.editPotensi=(i)=>{let p=data.potensiData[i];openModal('Edit Potensi',[{id:'komoditi',label:'Komoditi',value:p.komoditi},{id:'luas',label:'Luas',type:'number',value:p.luas},{id:'volume',label:'Volume',type:'number',value:p.volume},{id:'sdm',label:'SDM',type:'number',value:p.sdm},{id:'alamat',label:'Alamat',value:p.alamat}],v=>{v.luas=parseFloat(v.luas)||0;v.volume=parseFloat(v.volume)||0;v.sdm=parseInt(v.sdm)||0;data.potensiData[i]={...p,...v};save();});};
window.delPotensi=(i)=>{data.potensiData.splice(i,1);save();};
document.getElementById('addPotensiBtn').onclick=()=>{openModal('Tambah Potensi',[{id:'komoditi',label:'Komoditi'},{id:'luas',label:'Luas',type:'number'},{id:'volume',label:'Volume',type:'number'},{id:'sdm',label:'SDM',type:'number'},{id:'alamat',label:'Alamat'}],v=>{v.luas=parseFloat(v.luas)||0;v.volume=parseFloat(v.volume)||0;v.sdm=parseInt(v.sdm)||0;v.satuan='Ton';v.status='UMUM';v.dusun='Kali Branjang';v.rtrw='RT 01/RW 01';data.potensiData.push(v);save();});};
document.getElementById('saveKopdes').onclick=()=>{data.kopdes={nik:document.getElementById('kop_nik').value,nib:document.getElementById('kop_nib').value,sk:document.getElementById('kop_sk').value,total:parseInt(document.getElementById('kop_total').value)||0,laki:parseInt(document.getElementById('kop_laki').value)||0,perempuan:parseInt(document.getElementById('kop_perempuan').value)||0};save();};
window.editPengurus=(i)=>{let p=data.pengurus[i];openModal('Edit Pengurus',[{id:'nama',label:'Nama',value:p.nama}],v=>{data.pengurus[i]={...p,...v};save();});};
window.delPengurus=(i)=>{data.pengurus.splice(i,1);save();};
document.getElementById('addPengurusBtn').onclick=()=>{openModal('Tambah Pengurus',[{id:'nama',label:'Nama'}],v=>{v.jabatan='Pengurus';v.dusun='Kali Branjang';v.rtrw='RT 01/RW 01';v.alamat='';v.hp='628';data.pengurus.push(v);save();});};
window.editPengawas=(i)=>{let p=data.pengawas[i];openModal('Edit Pengawas',[{id:'nama',label:'Nama',value:p.nama}],v=>{data.pengawas[i]={...p,...v};save();});};
window.delPengawas=(i)=>{data.pengawas.splice(i,1);save();};
document.getElementById('addPengawasBtn').onclick=()=>{openModal('Tambah Pengawas',[{id:'nama',label:'Nama'}],v=>{v.jabatan='Pengawas';v.dusun='Kali Branjang';v.rtrw='RT 01/RW 01';v.alamat='';v.hp='628';data.pengawas.push(v);save();});};
document.getElementById('btnLogin').onclick=()=>{if(isLogin){localStorage.removeItem('kdmp_login');isLogin=false;renderAll();}else{let p=prompt('Password kasih123');if(p==='kasih123'){localStorage.setItem('kdmp_login','1');isLogin=true;renderAll();}}};
document.getElementById('btnTampilAnalisis').onclick=()=>{let omzet=data.konsumenData.reduce((a,b)=>a+(b.omzet||b.jml*15000),0);document.getElementById('analisisContent').innerHTML=`<b>Analisis Bisnis:</b><br>Omzet potensial Rp ${omzet.toLocaleString()}/bln<br>Desil: ${data.desil.length} data<br>Pekerjaan: ${data.pekerjaanData.length} jenis<br>Potensi: ${data.potensiData.map(p=>p.komoditi).join(', ')}`;document.getElementById('analisisBox').classList.remove('hidden');};
window.copyDesil=()=>{let t=data.desil.map(d=>`No ${d.no} ${d.desil} ${d.jml} org ${d.dusun} ${d.alamat}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Desil di-copy di bawah:\n'+t));};
window.copyPekerjaan=()=>{let t=data.pekerjaanData.map(p=>`${p.pekerjaan} ${p.jml} org ${p.alamat}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Pekerjaan di-copy'));}
window.copyKonsumen=()=>{let t=data.konsumenData.map(k=>`${k.jenis} ${k.jml} Daya ${k.daya} ${k.frekuensi} ${k.alamat}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Konsumen di-copy'));}
window.copyPotensi=()=>{let t=data.potensiData.map(p=>`${p.komoditi} ${p.luas}Ha ${p.volume}${p.satuan} SDM ${p.sdm} ${p.alamat}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Potensi di-copy'));}
window.copyStakeholder=()=>{let t=data.stakeholders.map(s=>`${s.nama} ${s.jabatan} ${s.dusun} ${s.hp}`).join('\n');navigator.clipboard.writeText(t).then(()=>alert('Stakeholder di-copy'));}
renderTabs();renderAll();
if(stored){console.log('Data lama ditemukan:',stored.desil?.length,'desil');}
</script></body></html>
