<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KDKMP Desa Kasih - Stok Live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#f1f5f2}
.header{background:#0f4d2e;color:white;padding:20px 16px;text-align:center}
.tabs{display:flex;gap:8px;padding:12px;background:white;position:sticky;top:0;z-index:10;overflow-x:auto}
.tab{padding:10px 16px;border-radius:20px;border:1px solid #d1d5db;background:#f9fafb;font-weight:600;font-size:13px;white-space:nowrap}
.tab.active{background:#0f4d2e;color:white}
.content{padding:16px;max-width:700px;margin:auto}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.badge{padding:4px 10px;border-radius:20px;font-size:12px;background:#d1fae5;margin-right:6px}
.hidden{display:none}
.bar{height:10px;background:#e5e7eb;border-radius:10px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:#16a34a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.box{background:#f9fafb;border-radius:12px;padding:10px;text-align:center}
.box b{display:block;font-size:18px}
#qrcode{display:flex;justify-content:center;margin:12px 0}
</style>
</head>
<body>
<div class="header"><h1 style="margin:0">KDKMP DESA KASIH</h1><p style="font-size:12px;opacity:.8">Stok Live & Omzet Harian</p></div>
<div class="tabs">
<button class="tab active" onclick="openTab('beras',this)">🌾 Stok Live</button>
<button class="tab" onclick="openTab('laporan',this)">📊 Laporan</button>
<button class="tab" onclick="openTab('profil',this)">🏡 Profil</button>
<button class="tab" onclick="openTab('kontak',this)">📍 Kontak</button>
</div>
<div class="content">
<div id="beras"><div id="listBeras">Memuat...</div></div>
<div id="laporan" class="hidden"><div id="listLaporan"></div></div>
<div id="profil" class="hidden"><div class="card"><h3>Profil</h3><p style="font-size:14px">Desa Kasih - Kertanegara - Purbalingga. Gerai KDKMP menunggu PIC Agrinas.</p></div></div>
<div id="kontak" class="hidden"><div class="card"><h3>Kontak</h3><p><a href="./admin.html">Login Manajer/Karyawan</a></p><div id="qrcode"></div></div></div>
</div>
<script>
function openTab(id,el){document.querySelectorAll('.content>div').forEach(d=>d.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active')}
fetch('./data.json?t='+Date.now()).then(r=>r.json()).then(data=>{
 let beras='', lap='';
 let totalMasuk=0,totalJual=0,totalOmzet=0;
 data.slice().reverse().forEach(it=>{
  let masuk=it.masuk||0, sisa=it.sisa||0, jual=it.terjual||0, omzet=it.omzet||0, pct=masuk?Math.round(sisa/masuk*100):0;
  totalMasuk+=masuk; totalJual+=jual; totalOmzet+=omzet;
  beras+=`<div class="card"><div style="font-size:11px;color:gray">${it.tanggal} ${it.jam||''} • oleh ${it.oleh||'admin'}</div><div style="font-weight:700;margin:4px 0">${it.judul}</div><div style="font-size:14px;white-space:pre-line">${it.isi}</div><div class="bar"><div style="width:${pct}%"></div></div><div class="grid"><div class="box"><span>Sisa</span><b>${sisa}</b>karung</div><div class="box"><span>Terjual</span><b>${jual}</b>karung</div><div class="box"><span>Harga</span><b style="font-size:14px">${it.harga||''}</b></div><div class="box"><span>Omzet</span><b style="font-size:13px">Rp ${omzet.toLocaleString('id-ID')}</b></div></div></div>`;
 });
 lap=`<div class="card"><h3>Rekap Total</h3><div class="grid"><div class="box"><span>Total Datang</span><b>${totalMasuk}</b></div><div class="box"><span>Total Terjual</span><b>${totalJual}</b></div><div class="box"><span>Sisa Akhir</span><b>${totalMasuk-totalJual}</b></div><div class="box"><span>Omzet Total</span><b style="font-size:13px">Rp ${totalOmzet.toLocaleString('id-ID')}</b></div></div></div>`+beras;
 document.getElementById('listBeras').innerHTML=beras||'Belum ada data'; document.getElementById('listLaporan').innerHTML=lap;
});
new QRCode(document.getElementById("qrcode"),{text:"https://kdkmp-kasih.github.io/kdkmp-kasih/desa.html",width:140,height:140});
</script>
</body>
</html>
