<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin KDKMP</title>
<style>body{font-family:system-ui;background:#eef2f0;padding:12px}.card{background:white;border-radius:16px;padding:16px;max-width:600px;margin:12px auto}input,textarea,select{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:10px}button{width:100%;padding:12px;border:0;border-radius:10px;font-weight:700} .g{background:#0f4d2e;color:white} #panel{display:none}</style>
</head><body>
<div class="card" id="login"><h3>Login Pengelola</h3><select id="selUser"></select><input id="pass" type="password" placeholder="Password"><button class="g" onclick="login()">Masuk</button><p style="font-size:12px">Default: manajer / kasih2026</p></div>
<div id="panel"><div class="card">
<h3 id="hi"></h3>
<label>Tanggal</label><input id="tgl"><label>Judul</label><input id="judul"><label>Isi</label><textarea id="isi" rows="4"></textarea><label>Harga</label><input id="harga" value="Rp62.500 / 5kg"><label>Stok</label><input id="stok" value="Tersedia">
<button class="g" onclick="buat()">Buat Info Baru</button>
<textarea id="raw" rows="8" style="margin-top:12px"></textarea>
<button class="g" onclick="download()" style="background:#2563eb;margin-top:8px">📥 Download data.json</button>
<p style="font-size:12px">Setelah download: Buka GitHub > file data.json > Edit (pensil) > Paste isi download > Commit. 1 menit langsung muncul di desa.html</p>
</div>
<div class="card" id="boxUser"><h4>Tambah Karyawan (Manajer only)</h4><input id="nName" placeholder="nama karyawan baru, contoh: budi"><input id="nPass" placeholder="password baru"><button onclick="addUser()" style="background:#e5e7eb">+ Tambah</button><div id="listU" style="font-size:13px;margin-top:8px"></div></div></div>
<script>
let USERS=JSON.parse(localStorage.getItem('kdkmp_users')||'[{"name":"manajer","pass":"kasih2026","role":"manajer"}]');
let DATA=[], CUR=null;
function render(){selUser.innerHTML='';USERS.forEach(u=>{let o=document.createElement('option');o.value=u.name;o.textContent=u.name+' - '+u.role;selUser.appendChild(o)});let h='';USERS.forEach(u=>h+=`<div>${u.name} (${u.role})</div>`);listU.innerHTML=h}
render();
function login(){let u=USERS.find(x=>x.name===selUser.value&&x.pass===pass.value); if(!u) return alert('Salah'); CUR=u; login.style.display='none'; panel.style.display='block'; hi.textContent='Halo '+u.name; tgl.value=new Date().toLocaleDateString('id-ID'); load()}
async function load(){try{let r=await fetch('./data.json?t='+Date.now()); DATA=await r.json(); raw.value=JSON.stringify(DATA,null,2)}catch{DATA=[]}}
function addUser(){if(CUR.role!=='manajer') return alert('Hanya manajer'); let n=nName.value.trim().toLowerCase(), p=nPass.value.trim(); if(!n||!p) return alert('Isi nama pass'); USERS.push({name:n,pass:p,role:'karyawan'}); localStorage.setItem('kdkmp_users',JSON.stringify(USERS)); render(); nName.value=''; nPass.value='';}
function buat(){let baru={tanggal:tgl.value,judul:judul.value,isi:isi.value,harga:harga.value,stok:stok.value,oleh:CUR.name,role:CUR.role}; DATA.push(baru); raw.value=JSON.stringify(DATA,null,2); alert('Info dibuat di bawah, tinggal Download')}
function download(){let b=new Blob([raw.value],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='data.json'; a.click()}
</script></body></html>
