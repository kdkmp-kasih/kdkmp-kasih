<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8.2 - Lengkap Lokasi + Progres - KDKMP Kasih</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc]">
<div class="bg-[#0f5132] text-white sticky top-0 z-50 shadow">
<div class="max-w-5xl mx-auto p-3 flex justify-between items-center gap-2">
<div class="flex-1"><h1 class="font-bold text-[12px]">RENCANA KERJA 30 HARI + LOKASI + PROGRES</h1><p class="text-[9px] opacity-80">KDKMP Desa Kasih - V8.2</p>
<div class="flex items-center gap-2 mt-1">
<label class="text-[9px]">Set Hari-1:</label>
<input type="date" id="startInput" class="text-[10px] text-black rounded px-1.5 py-0.5" onchange="setStartDate(this.value)">
<button onclick="resetStart()" class="text-[9px] bg-white/20 px-2 py-0.5 rounded">Reset</button>
<span class="text-[8px] bg-blue-500 px-2 py-0.5 rounded-full">RUMAH = Bisa dari Rumah</span>
<span class="text-[8px] bg-orange-500 px-2 py-0.5 rounded-full">DESA/GERAI = Ke Lokasi</span>
</div>
<p id="tgl" class="text-[10px] font-bold text-yellow-200 mt-1"></p></div>
<div class="text-right"><div class="w-28 h-2 bg-white/20 rounded-full"><div id="bar" class="h-2 bg-yellow-300 rounded-full" style="width:0%"></div></div><p id="txt" class="text-[10px] font-bold">0%</p></div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3 space-y-3">
<div id="rekap" class="bg-white border-2 border-[#0f5132] p-3 rounded-xl"></div>
<div id="alertLembur" class="hidden bg-amber-50 border border-amber-300 p-3 rounded-xl">
<p class="text-[11px] font-bold text-amber-800">⚠️ Lembur - Kerja Lebih Awal:</p><div id="listLembur" class="text-[10px] text-amber-700 mt-1"></div>
</div>
<div id="container" class="grid gap-3"></div>
</div>

<script>
function getStoredStart(){return localStorage.getItem('kdkmp_startDate');}
function setStartDate(v){localStorage.setItem('kdkmp_startDate',v); render();}
function resetStart(){localStorage.removeItem('kdkmp_startDate'); document.getElementById('startInput').value=''; render();}
function getStartDateObj(){const s=getStoredStart(); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const start=getStartDateObj(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1, Math.floor((now-start)/86400000)+1);}

const days=[
{d:1,t:"Laporan Diri & Silaturahmi Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan dan serah terima penugasan kepada Kepala Desa/Lurah dan Pengurus KDKMP","Bersilaturahmi dengan pimpinan BPD","Mendata kontak tokoh masyarakat dan ketua RT/RW"]},
{d:2,t:"Penyampaian Visi Kepemimpinan",m:"DESA",tasks:["Bersilaturahmi dengan tokoh masyarakat, RT/RW","Menyampaikan visi inklusif, kolaboratif, transparan","Mencatat aspirasi awal warga"]},
{d:3,t:"Inventarisasi Aset Fisik",m:"GERAI",tasks:["Memeriksa & mencatat aset fisik (kantor, mesin/peralatan)","Mencatat persediaan barang/stok usaha","Foto dokumentasi untuk BAST"]},
{d:4,t:"Audit Administrasi Awal",m:"RUMAH",tasks:["Memeriksa dokumen legalitas","Memeriksa buku rekening bank & arsip keuangan","Menguji coba akses login SIMKOPDES - BISA DARI RUMAH"]},
{d:5,t:"Pemetaan Kondisi Anggota",m:"RUMAH",tasks:["Mengumpulkan data anggota aktif, pasif, calon - BISA DARI RUMAH via WA","Rekap data untuk SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi & Data Desil",m:"RUMAH",tasks:["Meninjau data Desil wilayah - BISA DARI RUMAH","Memetakan potensi ekonomi desa"]},
{d:7,t:"Deliverable Minggu 1 - BAST",m:"RUMAH",tasks:["Menyusun Laporan BAST Aset & Dokumen - BISA DARI RUMAH","Susun Dokumen Pemetaan Awal","Kirim laporan Minggu 1 ke Kades via WA"]},
{d:8,t:"Implementasi SIMKOPDES - Anggota",m:"RUMAH",tasks:["Input/update anggota & profil ke SIMKOPDES - BISA DARI RUMAH","Verifikasi NIK"]},
{d:9,t:"Implementasi SIMKOPDES - Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan selaras SIMKOPDES - BISA DARI RUMAH","Input saldo awal kas & bank"]},
{d:10,t:"Integrasi Sertifikat Elektronik Privy",m:"RUMAH",tasks:["Pastikan integrasi Privy - BISA DARI RUMAH","Uji coba ttd elektronik"]},
{d:11,t:"SOP Kas & Keuangan",m:"RUMAH",tasks:["Susun SOP Kas & Keuangan (kas kecil, penerimaan, laporan harian) - BISA DARI RUMAH"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["Susun SOP Pelayanan Anggota & SOP Stok/Barang - BISA DARI RUMAH"]},
{d:13,t:"Persiapan Rapat Konsolidasi",m:"RUMAH",tasks:["Siapkan materi pemetaan & draf SOP - BISA DARI RUMAH","Buat undangan Pengurus & Pengawas"]},
{d:14,t:"Rapat Konsolidasi Pengurus",m:"DESA",tasks:["Presentasi pemetaan & SOP ke Pengurus & Pengawas - HARUS KE DESA","Sepakati Q1 Targets","Deliverable: SIMKOPDES & Buku SOP"]},
{d:15,t:"Quick Win - Persiapan",m:"RUMAH",tasks:["Tentukan Quick Win: Sembako/Pupuk/PPOB - BISA DARI RUMAH","Siapkan stok awal & daftar harga","Koordinasi Agrinas 1 pintu via WA"]},
{d:16,t:"Quick Win - Operasional",m:"GERAI",tasks:["Pelaksanaan layanan prioritas Quick Win - HARUS DI GERAI","Penyediaan kebutuhan pokok/pupuk"]},
{d:17,t:"Pencatatan Real-time SIMKOPDES",m:"GERAI",tasks:["Pencatatan transaksi Quick Win real-time - DI GERAI","Cek stok & cash"]},
{d:18,t:"Kampanye Sosialisasi Forum Desa",m:"DESA",tasks:["Sosialisasi di rembug warga/pengajian/RWT - HARUS KE DESA","Jelaskan hak/kewajiban & SHU"]},
{d:19,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran anggota baru - DI DESA","Bagi brosur literasi keuangan"]},
{d:20,t:"Literasi & Rekrutmen",m:"DESA",tasks:["Edukasi transparansi SHU - DI DESA","Kumpulkan 10 calon anggota baru"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win - DI GERAI","Rekap anggota baru","Laporan Minggu 3"]},
{d:22,t:"Penutupan Buku - Reconcile",m:"RUMAH",tasks:["Reconcile kas/bank/SIMKOPDES - BISA DARI RUMAH","Verifikasi transaksi"]},
{d:23,t:"Laporan Keuangan Bulanan",m:"RUMAH",tasks:["Susun Laba/Rugi, Neraca Kas - BISA DARI RUMAH","Susun Laporan Perkembangan Anggota"]},
{d:24,t:"Analisis Quick Win",m:"RUMAH",tasks:["Analisis omzet & margin - BISA DARI RUMAH","Analisis animo warga"]},
{d:25,t:"Persiapan Pelaporan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Bulanan untuk Dinkop/Kementerian - BISA DARI RUMAH"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim Laporan ke pembina via online - BISA DARI RUMAH","Diskusi dengan Pendamping"]},
{d:27,t:"Koordinasi Dinas",m:"RUMAH",tasks:["Koordinasi Pendamping wilayah - BISA DARI RUMAH via WA/Telp"]},
{d:28,t:"Persiapan Evaluasi Bulanan",m:"RUMAH",tasks:["Susun materi evaluasi 30 hari - BISA DARI RUMAH","Draf Rencana Bulan 2"]},
{d:29,t:"Rapat Evaluasi Bulanan",m:"DESA",tasks:["Rapat evaluasi bersama Pengurus - HARUS KE DESA","Catat masukan & kendala"]},
{d:30,t:"Master Plan Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2 - BISA DARI RUMAH","Finalisasi Laporan Resmi & Master Plan","Export & kirim ke Kades/Korwil/Dinas"]},
];

const container=document.getElementById('container');
function render(){
 const stored=getStoredStart(); if(stored) document.getElementById('startInput').value=stored;
 const startObj=getStartDateObj(); const hariIni=getHariIni();
 document.getElementById('tgl').innerText=`Start Hari-1: ${startObj.toLocaleDateString('id-ID')} | Hari ini: Hari ke-${hariIni} (${new Date().toLocaleDateString('id-ID',{weekday:'long'})})`;

 container.innerHTML=''; let total=0,done=0; let lembur=[]; let sudah=[]; let belum=[];
 days.forEach(day=>{
   const color = day.m==='RUMAH'?'bg-blue-100 text-blue-700 border-blue-200':day.m==='DESA'?'bg-orange-100 text-orange-700 border-orange-200':'bg-green-100 text-green-700 border-green-200';
   let html=day.tasks.map((t,i)=>{
     const key=`v82_${day.d}_${i}`; const chk=localStorage.getItem(key)==='1';
     if(chk){done++; if(day.d===hariIni) sudah.push(t); if(day.d>hariIni) lembur.push(`Hari ${day.d} [${day.m}]: ${t}`);}
     else if(day.d<=hariIni) belum.push(`Hari ${day.d} [${day.m}]: ${t}`);
     total++;
     return `<label class="flex gap-2 items-start py-1.5 px-2 rounded hover:bg-slate-50 cursor-pointer border-b last:border-0 ${day.d>hariIni && chk?'bg-amber-50':''}"><input type="checkbox" data-key="${key}" data-day="${day.d}" ${chk?'checked':''} class="mt-0.5 w-4 h-4 accent-[#0f5132]"><span class="text-[11px] leading-snug ${chk?'line-through text-slate-400':''}">${t} ${day.d>hariIni && chk?'<b class=text-amber-600> ⚠️ LEMBUR</b>':''}</span></label>`;
   }).join('');
   const sisa=day.tasks.length - day.tasks.filter((_,i)=>localStorage.getItem(`v82_${day.d}_${i}`)==='1').length;
   const isToday=day.d===hariIni;
   const div=document.createElement('div');
   div.className=`bg-white p-3 rounded-xl border shadow-sm ${isToday?'ring-2 ring-[#0f5132]':''}`;
   div.innerHTML=`<div class="flex justify-between items-center gap-2"><div class="flex items-center gap-2"><p class="font-bold text-[12px] ${isToday?'text-[#0f5132]':''}">${isToday?'👉 ':''}HARI ${day.d}: ${day.t}</p><span class="text-[9px] px-2 py-0.5 rounded-full border font-bold ${color}">${day.m} ${day.m==='RUMAH'?'🏠':'📍'}</span></div><span class="text-[9px] px-2 py-0.5 rounded-full font-bold ${sisa===0?'bg-green-100 text-green-700':'bg-slate-100'}">${sisa===0?'Selesai':'Sisa '+sisa}</span></div><p class="text-[9px] text-slate-500 mt-1">${day.m==='RUMAH'?'✅ Bisa dikerjakan dari rumah - cukup HP & SIMKOPDES':day.m==='DESA'?'⚠️ Harus ke Desa - Rapat/Sosialisasi':'📦 Harus di Gerai - Cek Fisik/Stok'}</p><div class="mt-2 bg-slate-50 rounded border">${html}</div><textarea id="note${day.d}" placeholder="Progres hari ${day.d} - udah ngapain aja di ${day.m}..." class="mt-2 w-full border rounded p-2 text-[11px] h-12">${localStorage.getItem('noteV82_'+day.d)||''}</textarea>`;
   container.appendChild(div);
 });
 const persen=total?Math.round(done/total*100):0;
 document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'% ('+done+'/'+total+')';
 document.getElementById('rekap').innerHTML=`
 <p class="font-bold text-[12px]">📊 PROGRES HARIAN - Hari ke-${hariIni} | Lokasi: ${days[hariIni-1]?.m || ''}</p>
 <div class="grid grid-cols-2 gap-2 mt-2">
 <div class="bg-green-50 border border-green-200 p-2 rounded-lg"><p class="text-[10px] font-bold text-green-800">✅ SUDAH HARI INI:</p><p class="text-[10px] text-green-700 mt-1">${sudah.length?sudah.map(s=>`• ${s}`).join('<br>'):'Belum centang'}</p></div>
 <div class="bg-red-50 border border-red-200 p-2 rounded-lg"><p class="text-[10px] font-bold text-red-800">⏳ BELUM s.d. HARI INI:</p><p class="text-[10px] text-red-700 mt-1">${belum.slice(0,5).map(s=>`• ${s}`).join('<br>')}${belum.length>5?`<br>+${belum.length-5} lagi`:''}${belum.length===0?'Beress!':''}</p></div>
 </div>`;

 if(lembur.length>0){document.getElementById('alertLembur').classList.remove('hidden'); document.getElementById('listLembur').innerHTML=lembur.map(l=>`• ${l}`).join('<br>');}
 else document.getElementById('alertLembur').classList.add('hidden');

 container.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{localStorage.setItem(e.target.dataset.key,e.target.checked?'1':'0'); render();}));
 container.querySelectorAll('textarea').forEach(ta=>ta.addEventListener('input',e=>{localStorage.setItem('noteV82_'+e.target.id.replace('note',''),e.target.value);}));
}
render();
</script>
</body>
</html>
