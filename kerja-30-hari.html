<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V20 FIX FONT + TTD 1 BARIS - KDKMP KASIH</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-[#f8fafc]">
<div class="bg-[#0f5132] text-white sticky top-0 z-50">
<div class="max-w-5xl mx-auto p-3">
<div class="flex justify-between"><div><h1 class="font-bold text-[11px]">V20 - FIX FONT RENGgang + TTD 1 BARIS</h1><p id="tgl" class="text-[9px] text-yellow-200 mt-1"></p></div><div class="text-right"><div class="w-24 h-2 bg-white/20 rounded-full"><div id="bar" class="h-2 bg-yellow-300 rounded-full" style="width:0%"></div></div><p id="txt" class="text-[9px] font-bold">0%</p></div></div>
<div class="flex gap-2 mt-3">
<button id="tab1" onclick="switchTab(1)" class="px-3 py-2 rounded text-[11px] font-bold bg-white text-[#0f5132]">TAB 1: 1-30</button>
<button id="tab2" onclick="switchTab(2)" class="px-3 py-2 rounded text-[11px] font-bold bg-white/20">TAB 2: 31-60</button>
<button id="tab3" onclick="switchTab(3)" class="px-3 py-2 rounded text-[11px] font-bold bg-white/20">TAB 3: TTD CAP NAMA</button>
</div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3 space-y-3">
<div id="content1"><div id="container1" class="grid gap-3"></div></div>
<div id="content2" class="hidden"><div class="bg-white border-2 border-blue-200 p-3 rounded-xl"><div class="grid grid-cols-4 gap-2"><input id="newDay" type="number" placeholder="31-60" class="border rounded p-2 text-[11px]"><input id="newTitle" placeholder="Judul" class="border rounded p-2 text-[11px] col-span-2"><select id="newMode" class="border rounded p-2 text-[11px]"><option>RUMAH</option><option>DESA</option><option>GERAI</option></select></div><textarea id="newTasks" placeholder="1 baris = 1 kotak" class="w-full border rounded p-2 text-[11px] h-12 mt-2"></textarea><button onclick="addNewDay()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded text-[11px] font-bold w-full">+ Tambah Hari</button></div><div id="container2" class="grid gap-3 mt-3"></div></div>

<div id="content3" class="hidden space-y-3">
<div class="bg-white border-2 border-[#0f5132] p-4 rounded-xl">
<p class="font-bold text-[12px]">TTD + CAP - Pilih yang aktif, nanti di PDF jadi 1 baris lurus</p>
<div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-3">
<div class="border-2 border-orange-300 p-2 rounded bg-orange-50"><p class="text-[10px] font-bold">KADES</p><input id="namaKades" placeholder="Nama Kades (Supriyadi)" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdKades')"><img id="prevKades" class="h-12 object-contain mt-1 border hidden"><p class="text-[9px] mt-1 font-bold">Cap Kades (di posisi Kades)</p><input type="file" accept="image/*" class="text-[8px] w-full" onchange="saveImg(this,'capKades')"><img id="prevCapKades" class="h-12 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needKades" checked onchange="saveNeed()"> TTD</label> <label class="text-[9px]"><input type="checkbox" id="needCapKades" checked onchange="saveNeed()"> Cap</label></div>
<div class="border-2 border-green-300 p-2 rounded bg-green-50"><p class="text-[10px] font-bold">MANAJER</p><input id="namaManajer" placeholder="Nama Manajer" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdManajer')"><img id="prevManajer" class="h-12 object-contain mt-1 border hidden"><p class="text-[9px] mt-1 font-bold">Cap KDKMP</p><input type="file" accept="image/*" class="text-[8px] w-full" onchange="saveImg(this,'capKoperasi')"><img id="prevCap" class="h-12 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needManajer" checked onchange="saveNeed()"> TTD</label> <label class="text-[9px]"><input type="checkbox" id="needCap" checked onchange="saveNeed()"> Cap</label></div>
<div class="border-2 border-blue-300 p-2 rounded bg-blue-50"><p class="text-[10px] font-bold">KETUA KOPDES</p><input id="namaKetua" placeholder="Nama Ketua" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdKetua')"><img id="prevKetua" class="h-12 object-contain mt-1 border hidden"><p class="text-[9px] mt-1 font-bold">Cap Ketua (di posisi Ketua)</p><input type="file" accept="image/*" class="text-[8px] w-full" onchange="saveImg(this,'capKetua')"><img id="prevCapKetua" class="h-12 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needKetua" onchange="saveNeed()"> Aktif</label> <label class="text-[9px]"><input type="checkbox" id="needCapKetua" onchange="saveNeed()"> Cap</label></div>
</div>
<div class="mt-3 border p-2 rounded"><p class="text-[10px] font-bold">Pengawas (opsional baris ke-2)</p><input id="namaPengawas" placeholder="Nama Pengawas" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdPengawas')"><img id="prevPengawas" class="h-12 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needPengawas" onchange="saveNeed()"> Aktif</label></div>
</div>
</div>

<div class="bg-white p-4 rounded-xl border"><button onclick="exportPDF()" class="bg-[#0f5132] text-white px-5 py-3 rounded-lg text-xs font-bold w-full">📄 EXPORT PDF - FONT SAMA RAPI + TTD 1 BARIS LURUS</button></div>
</div>

<script>
const { jsPDF } = window.jspdf;
function switchTab(n){document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{document.getElementById(id).className=(i+1===n)?'px-3 py-2 rounded text-[11px] font-bold bg-white text-[#0f5132]':'px-3 py-2 rounded text-[11px] font-bold bg-white/20 text-white';}); render();}
function getStartDateObj(){return new Date();}
function getHariIni(){return 14;}
function saveNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>localStorage.setItem('need'+k,document.getElementById('need'+k).checked));}
function loadNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('need'+k); if(v!==null) document.getElementById('need'+k).checked=v==='true'; else document.getElementById('need'+k).checked=(k==='Manajer'||k==='Kades'||k==='Cap'||k==='CapKades');});}
function saveNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);});}
function loadNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('nama'+k); if(v){const el=document.getElementById('nama'+k); if(el) el.value=v;}} else if(k==='Kades'){document.getElementById('namaKades').value='Supriyadi'; localStorage.setItem('namaKades','Supriyadi');}});}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap','capKades':'prevCapKades','capKetua':'prevCapKetua','ttdKetua':'prevKetua','ttdPengawas':'prevPengawas'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d){e.src=d; e.classList.remove('hidden');} else e.classList.add('hidden');});}
loadNeed(); loadNames(); loadImgs();
function getCustomDays(){return JSON.parse(localStorage.getItem('customDays')||'[]');}
function getDeleted(day){return JSON.parse(localStorage.getItem(`deleted_${day}`)||'[]');}
function getAdded(day){return JSON.parse(localStorage.getItem(`added_${day}`)||'[]');}
function getText(day,idx,def){return localStorage.getItem(`custom_text_${day}_${idx}`)||def;}
function getStatus(day,idx,isAdd){return localStorage.getItem(isAdd?`status_${day}_add_${idx}`:`status_${day}_${idx}`)||'';}
function isChecked(day,idx,isAdd){const prefixes=['v20','v19','v18','v17','v16']; for(let p of prefixes){const key=isAdd?`${p}_${day}_add_${idx}`:`${p}_${day}_${idx}`; if(localStorage.getItem(key)==='1') return true;} return false;}
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
];

function render(){
 const all=[...baseDays,...getCustomDays()]; let total=0,done=0; all.forEach(d=>{const del=getDeleted(d.d); const add=getAdded(d.d); total+=d.tasks.length-del.length+add.length; d.tasks.forEach((_,i)=>{if(!del.includes(i)&&isChecked(d.d,i,false)) done++;}); add.forEach((_,i)=>{if(isChecked(d.d,i,true)) done++;});});
 const persen=total?Math.round(done/total*100):0; document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'%';
 document.getElementById('tgl').innerText=`Hari ke-14 - 14 Oktober 2026`;

 function renderContainer(days, containerId){
   const container=document.getElementById(containerId); container.innerHTML='';
   days.sort((a,b)=>a.d-b.d).forEach(day=>{
     const deleted=getDeleted(day.d); const added=getAdded(day.d); let html='';
     day.tasks.forEach((orig,i)=>{if(deleted.includes(i)) return; const key=`v20_${day.d}_${i}`; const text=getText(day.d,i,orig); const chk=isChecked(day.d,i,false); const status=getStatus(day.d,i,false); html+=`<div class="flex items-center gap-2 py-2 px-2 border-b"><input type="checkbox" data-key="${key}" data-day="${day.d}" data-idx="${i}" data-add="0" ${chk?'checked':''} class="w-5 h-5"><span class="flex-1 text-[12px]">${text}</span><div class="flex gap-1"><button onclick="setStatus(${day.d},${i},'ADA',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button><button onclick="setStatus(${day.d},${i},'TIDAK',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button><button onclick="setStatus(${day.d},${i},'BELUM',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button></div></div>`;});
     added.forEach((t,i)=>{const key=`v20_${day.d}_add_${i}`; const chk=isChecked(day.d,i,true); const status=getStatus(day.d,i,true); const cleanText=t.trim().replace(/^[\+\-\`\'\"]+/, '').trim(); html+=`<div class="flex items-center gap-2 py-2 px-2 border-b bg-blue-50/40"><input type="checkbox" data-key="${key}" data-day="${day.d}" data-idx="${i}" data-add="1" ${chk?'checked':''} class="w-5 h-5"><span class="flex-1 text-[12px]">${cleanText}</span><div class="flex gap-1"><button onclick="setStatus(${day.d},${i},'ADA',true)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button></div></div>`;});
     const div=document.createElement('div'); div.className=`bg-white p-3 rounded-xl border`; div.innerHTML=`<p class="font-bold text-[12px]">HARI ${day.d}: ${day.t}</p><div class="border rounded-lg mt-2 overflow-hidden">${html}</div><div class="flex gap-2 mt-2"><input id="input_${day.d}" placeholder="Tambah kotak (ketik biasa, tanpa +)" class="flex-1 border rounded p-2 text-[11px]"><button onclick="addTaskBox(${day.d})" class="bg-[#0f5132] text-white px-3 py-2 rounded text-[11px]">+ Kotak</button></div>`;
     container.appendChild(div);
   });
 }
 renderContainer(baseDays,'container1'); renderContainer(getCustomDays(),'container2');
 document.querySelectorAll('#container1 input[type=checkbox], #container2 input[type=checkbox]').forEach(cb=>{if(cb.id.startsWith('checkNote_')) return; cb.addEventListener('change',e=>{const day=e.target.dataset.day; const idx=e.target.dataset.idx; const isAdd=e.target.dataset.add; const key=`v20_${day}${isAdd==='1'?'_add':''}_${idx}`; localStorage.setItem(key,e.target.checked?'1':'0');});});
}
function addTaskBox(d){const el=document.getElementById(`input_${d}`); let v=el.value.trim(); if(!v) return; v=v.replace(/^[\+\-\`\'\"]+/, '').trim(); const ad=getAdded(d); ad.push(v); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); el.value=''; render();}
function setStatus(d,i,v,a){const k=a?`status_${d}_add_${i}`:`status_${d}_${i}`; const cur=localStorage.getItem(k); if(cur===v) localStorage.removeItem(k); else localStorage.setItem(k,v); render();}
render();

function exportPDF(){
 const doc=new jsPDF('l','mm','a4');
 const hariIni=14; const tgl="14 Oktober 2026"; const tglFile="2026-10-14";

 doc.setFillColor(15,81,50); doc.rect(0,0,297,22,'F');
 doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text("KDKMP KASIH",148.5,13,{align:'center'});
 doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.text(`Hari ke-${hariIni} - ${tgl}`,148.5,18,{align:'center'});

 const rows=[];
 [...baseDays,...getCustomDays()].sort((a,b)=>a.d-b.d).forEach(day=>{
   const del=getDeleted(day.d); const add=getAdded(day.d);
   day.tasks.forEach((orig,i)=>{
     if(del.includes(i)) return;
     let text=getText(day.d,i,orig);
     text=text.trim(); // FIX RENGANG
     const chk=isChecked(day.d,i,false)? 'SELESAI' : 'BELUM';
     const status=getStatus(day.d,i,false)||'-';
     rows.push([`Hari ${day.d}`, day.t, text, chk, status]);
   });
   add.forEach((t,i)=>{
     let cleanText=t.trim().replace(/^[\+\-\`\'\"\_]+/, '').trim().replace(/\s+/g,' '); // FIX FONT RENGANG - HAPUS + DAN SPASI GANDA
     const chk=isChecked(day.d,i,true)? 'SELESAI' : 'BELUM';
     const status=getStatus(day.d,i,true)||'-';
     rows.push([`Hari ${day.d}`, day.t, cleanText, chk, status]);
   });
 });

 doc.autoTable({
   startY:26,
   head:[['HARI','JUDUL','KEGIATAN / CHECKLIST','SELESAI','KONDISI']],
   body:rows,
   theme:'grid',
   styles:{font:'helvetica', fontSize:8, cellPadding:2.5, lineColor:[180,180,180], lineWidth:0.25, overflow:'linebreak', valign:'middle'},
   headStyles:{fillColor:[15,81,50], textColor:255, fontStyle:'bold', halign:'center'},
   columnStyles:{
     0:{cellWidth:15, halign:'center'},
     1:{cellWidth:30},
     2:{cellWidth:165}, // LEBAR
     3:{cellWidth:20, halign:'center'},
     4:{cellWidth:20, halign:'center'}
   },
   didParseCell:function(data){
     if(data.section==='body' && data.column.index===3){
       if(data.cell.raw==='SELESAI'){ data.cell.styles.fillColor=[220,252,231]; data.cell.styles.textColor=[22,101,52]; data.cell.styles.fontStyle='bold'; }
     }
   }
 });

 // TTD 1 BARIS LURUS 3 KOLOM
 doc.addPage('l','a4');
 doc.setFillColor(15,81,50); doc.rect(0,0,297,14,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text("KDKMP KASIH - PENGESAHAN",10,10);
 doc.setTextColor(0,0,0); doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.text(`Tanggal: ${tgl}`,10,20);

 const needKades=localStorage.getItem('needKades')!=='false'; const needCapKades=localStorage.getItem('needCapKades')!=='false';
 const needManajer=localStorage.getItem('needManajer')!=='false'; const needCap=localStorage.getItem('needCap')!=='false';
 const needKetua=localStorage.getItem('needKetua')==='true' || localStorage.getItem('needKetua')==='true' || true; // default tampilkan 3
 const needCapKetua=localStorage.getItem('needCapKetua')!=='false';

 const namaKades=localStorage.getItem('namaKades')||'Supriyadi';
 const namaManajer=localStorage.getItem('namaManajer')||'(Nama Manajer)';
 const namaKetua=localStorage.getItem('namaKetua')||'(Nama Ketua)';

 let y=30;
 // JUDUL 3 KOLOM SEJAJAR
 doc.setFont('helvetica','bold'); doc.setFontSize(11);
 const col1=15, col2=110, col3=205;

 if(needKades) doc.text("Kepala Desa Kasih",col1,y);
 if(needManajer) doc.text("Manajer KDKMP Kasih",col2,y);
 if(needKetua) doc.text("Ketua Kopdes Kasih",col3,y);

 try{
   const ttdKades=localStorage.getItem('ttdKades'); const capKades=localStorage.getItem('capKades');
   const ttdManajer=localStorage.getItem('ttdManajer'); const capKoperasi=localStorage.getItem('capKoperasi');
   const ttdKetua=localStorage.getItem('ttdKetua'); const capKetua=localStorage.getItem('capKetua');

   // BARIS 1: TTD + CAP SEJAJAR
   if(needKades && ttdKades) doc.addImage(ttdKades,'PNG',col1,y+3,32,16);
   if(needCapKades && capKades) doc.addImage(capKades,'PNG',col1+36,y+1,18,18);

   if(needManajer && ttdManajer) doc.addImage(ttdManajer,'PNG',col2,y+3,32,16);
   if(needCap && capKoperasi) doc.addImage(capKoperasi,'PNG',col2+36,y+1,18,18);

   if(needKetua && ttdKetua) doc.addImage(ttdKetua,'PNG',col3,y+3,32,16);
   if(needCapKetua && capKetua) doc.addImage(capKetua,'PNG',col3+36,y+1,18,18);
 } catch(e){}

 // NAMA DI BAWAH - 1 BARIS LURUS
 doc.setFont('helvetica','bold'); doc.setFontSize(10);
 if(needKades){ doc.text(namaKades,col1,y+26); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",col1,y+29); }
 if(needManajer){ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(namaManajer,col2,y+26); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",col2,y+29); }
 if(needKetua){ doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(namaKetua,col3,y+26); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",col3,y+29); }

 doc.save(`KDKMP-KASIH-Hari${hariIni}-${tglFile}-TTD-1BARIS.pdf`);
}
</script>
</body>
</html>
