<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V13 Edit Hapus Tambah Kotak - KDKMP Kasih</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-[#f8fafc]">
<div class="bg-[#0f5132] text-white sticky top-0 z-50">
<div class="max-w-5xl mx-auto p-3">
<div class="flex justify-between items-center">
<div><h1 class="font-bold text-[11px]">V13 - EDIT HAPUS TAMBAH KOTAK</h1><div class="flex items-center gap-2 mt-1"><label class="text-[9px]">Start Hari-1:</label><input type="date" id="startInput" class="text-[10px] text-black rounded px-1 py-0.5" onchange="setStartDate(this.value)"></div><p id="tgl" class="text-[9px] font-bold text-yellow-200 mt-1"></p></div>
<div class="text-right"><div class="w-24 h-2 bg-white/20 rounded-full"><div id="bar" class="h-2 bg-yellow-300 rounded-full" style="width:0%"></div></div><p id="txt" class="text-[9px] font-bold">0%</p></div>
</div>
<div class="flex gap-2 mt-3">
<button id="tab1" onclick="switchTab(1)" class="px-4 py-2 rounded-lg text-[11px] font-bold bg-white text-[#0f5132]">TAB 1: 1-30</button>
<button id="tab2" onclick="switchTab(2)" class="px-4 py-2 rounded-lg text-[11px] font-bold bg-white/20 text-white">TAB 2: 31-60</button>
<button id="tab3" onclick="switchTab(3)" class="px-4 py-2 rounded-lg text-[11px] font-bold bg-white/20 text-white">TAB 3: TTD</button>
</div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3 space-y-3">
<div id="content1" class="space-y-3"><div id="container1" class="grid gap-3"></div></div>
<div id="content2" class="space-y-3 hidden">
<div class="bg-white border-2 border-blue-200 p-3 rounded-xl">
<p class="font-bold text-[12px]">➕ Tambah Hari Baru 31-60</p>
<div class="grid grid-cols-4 gap-2 mt-2"><input id="newDay" type="number" min="31" max="60" placeholder="31-60" class="border rounded p-2 text-[11px]"><input id="newTitle" placeholder="Judul" class="border rounded p-2 text-[11px] col-span-2"><select id="newMode" class="border rounded p-2 text-[11px]"><option>RUMAH</option><option>DESA</option><option>GERAI</option></select></div>
<textarea id="newTasks" placeholder="1 baris = 1 kotak" class="mt-2 w-full border rounded p-2 text-[11px] h-16"></textarea>
<button onclick="addNewDay()" class="mt-2 bg-blue-600 text-white px-4 py-2 rounded text-[11px] font-bold w-full">+ Tambah Hari</button>
</div>
<div id="container2" class="grid gap-3"></div>
</div>
<div id="content3" class="space-y-3 hidden">
<div class="bg-white border-2 border-[#0f5132] p-3 rounded-xl">
<p class="font-bold text-[12px]">🖋️ TTD & Cap</p>
<div class="grid grid-cols-3 gap-3 mt-3">
<div class="border p-3 rounded bg-slate-50"><p class="text-[11px] font-bold">TTD Manajer</p><input type="file" accept="image/*" class="text-[9px] mt-1 w-full" onchange="saveImg(this,'ttdManajer')"><img id="prevManajer" class="w-full h-20 object-contain mt-2 border bg-white rounded hidden"><button onclick="hapusImg('ttdManajer')" class="text-[9px] bg-red-50 text-red-600 px-2 py-1 rounded mt-2">Hapus</button></div>
<div class="border p-3 rounded bg-slate-50"><p class="text-[11px] font-bold">TTD Kades</p><input type="file" accept="image/*" class="text-[9px] mt-1 w-full" onchange="saveImg(this,'ttdKades')"><img id="prevKades" class="w-full h-20 object-contain mt-2 border bg-white rounded hidden"><button onclick="hapusImg('ttdKades')" class="text-[9px] bg-red-50 text-red-600 px-2 py-1 rounded mt-2">Hapus</button></div>
<div class="border p-3 rounded bg-slate-50"><p class="text-[11px] font-bold">Cap</p><input type="file" accept="image/*" class="text-[9px] mt-1 w-full" onchange="saveImg(this,'capKoperasi')"><img id="prevCap" class="w-full h-20 object-contain mt-2 border bg-white rounded hidden"><button onclick="hapusImg('capKoperasi')" class="text-[9px] bg-red-50 text-red-600 px-2 py-1 rounded mt-2">Hapus</button></div>
</div>
</div>
</div>
<div class="bg-white p-4 rounded-xl border"><button onclick="exportPDF()" class="bg-[#0f5132] text-white px-5 py-3 rounded-lg text-xs font-bold w-full">📄 EXPORT PDF KOTAK CANTIK</button></div>
</div>

<script>
const { jsPDF } = window.jspdf;
let currentTab=1;
function switchTab(n){currentTab=n; document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{document.getElementById(id).className=(i+1===n)?'px-4 py-2 rounded-lg text-[11px] font-bold bg-white text-[#0f5132]':'px-4 py-2 rounded-lg text-[11px] font-bold bg-white/20 text-white';}); render();}

function getStoredStart(){return localStorage.getItem('kdkmp_startDate');}
function setStartDate(v){localStorage.setItem('kdkmp_startDate',v); render();}
function getStartDateObj(){const s=getStoredStart(); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const start=getStartDateObj(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1, Math.floor((now-start)/86400000)+1);}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function hapusImg(key){if(confirm('Hapus?')){localStorage.removeItem(key); loadImgs();}}
function loadImgs(){['ttdManajer','ttdKades','capKoperasi'].forEach(k=>{const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap'}; const d=localStorage.getItem(k); const el=document.getElementById(map[k]); if(d){el.src=d; el.classList.remove('hidden');} else el.classList.add('hidden');});}
loadImgs();
function getCustomDays(){return JSON.parse(localStorage.getItem('customDays')||'[]');}
function saveCustomDays(a){localStorage.setItem('customDays',JSON.stringify(a));}
function addNewDay(){const day=parseInt(document.getElementById('newDay').value); const title=document.getElementById('newTitle').value.trim(); const mode=document.getElementById('newMode').value; const raw=document.getElementById('newTasks').value.trim(); if(!day||day<31||day>60||!title||!raw){alert('Lengkapi'); return;} const tasks=raw.split('\n').map(s=>s.trim()).filter(Boolean); const c=getCustomDays(); c.push({d:day,t:title,m:mode,tasks}); c.sort((a,b)=>a.d-b.d); saveCustomDays(c); document.getElementById('newDay').value=''; document.getElementById('newTitle').value=''; document.getElementById('newTasks').value=''; render();}

const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
];

function getDeletedTasks(day){return JSON.parse(localStorage.getItem(`deleted_${day}`)||'[]');}
function getAddedTasks(day){return JSON.parse(localStorage.getItem(`added_${day}`)||'[]');}
function getTaskText(day,idx,def){return localStorage.getItem(`custom_text_${day}_${idx}`)||def;}
function getStatus(day,idx){return localStorage.getItem(`status_${day}_${idx}`)||'';}

function render(){
 const startObj=getStartDateObj(); const hariIni=getHariIni();
 document.getElementById('tgl').innerText=`Start: ${startObj.toLocaleDateString('id-ID')} | Hari ke-${hariIni}`;
 const all=[...baseDays,...getCustomDays()]; let total=0,done=0; all.forEach(d=>{const del=getDeletedTasks(d.d); const add=getAddedTasks(d.d); const totalTasks=d.tasks.length-del.length+add.length; total+=totalTasks; d.tasks.forEach((_,i)=>{if(!del.includes(i) && localStorage.getItem(`v13_${d.d}_${i}`)==='1') done++;}); add.forEach((_,i)=>{if(localStorage.getItem(`v13_${d.d}_add_${i}`)==='1') done++;});});
 const persen=total?Math.round(done/total*100):0; document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'% ('+done+'/'+total+')';

 function renderContainer(days, containerId, prefix){
   const container=document.getElementById(containerId); container.innerHTML='';
   days.sort((a,b)=>a.d-b.d).forEach(day=>{
     const deleted=getDeletedTasks(day.d); const added=getAddedTasks(day.d);
     let tasksHtml='';
     day.tasks.forEach((orig,i)=>{
       if(deleted.includes(i)) return;
       const key=`${prefix}_${day.d}_${i}`; const text=getTaskText(day.d,i,orig); const chk=localStorage.getItem(key)==='1'; const status=getStatus(day.d,i);
       tasksHtml+=`<div class="flex gap-2 items-start py-2 px-2 border-b group">
         <input type="checkbox" data-key="${key}" ${chk?'checked':''} class="mt-1 w-5 h-5">
         <div class="flex-1"><div class="flex justify-between"><span class="text-[12px] ${chk?'line-through text-slate-400':''}">${text}</span><div class="flex gap-1 opacity-0 group-hover:opacity-100"><button onclick="editTask(${day.d},${i},false)" class="text-[9px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded border">✏️ Edit</button><button onclick="deleteTask(${day.d},${i},false)" class="text-[9px] bg-red-50 text-red-600 px-2 py-0.5 rounded border">🗑️ Hapus</button></div></div>
         <div class="flex gap-1 mt-1"><button onclick="setStatus(${day.d},${i},'ADA',false)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button><button onclick="setStatus(${day.d},${i},'TIDAK',false)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button><button onclick="setStatus(${day.d},${i},'BELUM',false)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button></div></div></div>`;
     });
     added.forEach((t,i)=>{
       const key=`${prefix}_${day.d}_add_${i}`; const chk=localStorage.getItem(key)==='1'; const status=localStorage.getItem(`status_${day.d}_add_${i}`)||'';
       tasksHtml+=`<div class="flex gap-2 items-start py-2 px-2 border-b bg-blue-50/50 group">
         <input type="checkbox" data-key="${key}" ${chk?'checked':''} class="mt-1 w-5 h-5">
         <div class="flex-1"><div class="flex justify-between"><span class="text-[12px] ${chk?'line-through text-slate-400':''}">➕ ${t}</span><div class="flex gap-1 opacity-0 group-hover:opacity-100"><button onclick="editTask(${day.d},${i},true)" class="text-[9px] bg-blue-50 text-blue-600 px-2 py-0.5 rounded border">✏️ Edit</button><button onclick="deleteTask(${day.d},${i},true)" class="text-[9px] bg-red-50 text-red-600 px-2 py-0.5 rounded border">🗑️ Hapus</button></div></div>
         <div class="flex gap-1 mt-1"><button onclick="setStatus(${day.d},${i},'ADA',true)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button><button onclick="setStatus(${day.d},${i},'TIDAK',true)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button><button onclick="setStatus(${day.d},${i},'BELUM',true)" class="text-[9px] px-2 py-0.5 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button></div></div></div>`;
     });

     const isToday=day.d===hariIni; const color=day.m==='RUMAH'?'bg-blue-100 text-blue-700':day.m==='DESA'?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700';
     const div=document.createElement('div'); div.className=`bg-white p-3 rounded-xl border ${isToday?'ring-2 ring-[#0f5132]':''}`;
     div.innerHTML=`<div class="flex justify-between items-center"><div class="flex items-center gap-2"><p class="font-bold text-[12px]">${isToday?'👉 ':''}HARI ${day.d}: ${day.t}</p><span class="text-[9px] px-2 py-0.5 rounded-full ${color}">${day.m}</span></div></div><div class="mt-2 border rounded">${tasksHtml || '<p class=text-[11px] p-2 text-slate-400>Belum ada tugas</p>'}</div><div class="flex gap-2 mt-2"><input id="input_${day.d}" placeholder="Tambah kotak baru untuk hari ${day.d}..." class="flex-1 border rounded p-2 text-[11px]"><button onclick="addTaskBox(${day.d})" class="bg-[#0f5132] text-white px-3 py-2 rounded text-[11px] font-bold">+ Tambah Kotak</button></div>`;
     container.appendChild(div);
   });
 }

 renderContainer(baseDays,'container1','v13');
 renderContainer(getCustomDays(),'container2','v13');
 document.querySelectorAll('#container1 input[type=checkbox], #container2 input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{localStorage.setItem(e.target.dataset.key,e.target.checked?'1':'0'); render();}));
}

function editTask(day,idx,isAdded){
  if(isAdded){const added=getAddedTasks(day); const cur=added[idx]; const baru=prompt('Edit kotak:',cur); if(baru===null) return; if(baru.trim()){added[idx]=baru.trim(); localStorage.setItem(`added_${day}`,JSON.stringify(added)); render();}}
  else {const all=[...baseDays,...getCustomDays()]; const d=all.find(x=>x.d===day); const def=d.tasks[idx]; const cur=getTaskText(day,idx,def); const baru=prompt('Edit kotak:',cur); if(baru===null) return; if(baru.trim()===def || baru.trim()===''){localStorage.removeItem(`custom_text_${day}_${idx}`);} else localStorage.setItem(`custom_text_${day}_${idx}`,baru.trim()); render();}
}
function deleteTask(day,idx,isAdded){
  if(!confirm('Hapus kotak ini?')) return;
  if(isAdded){const added=getAddedTasks(day); added.splice(idx,1); localStorage.setItem(`added_${day}`,JSON.stringify(added)); localStorage.removeItem(`v13_${day}_add_${idx}`); render();}
  else {const del=getDeletedTasks(day); if(!del.includes(idx)){del.push(idx); localStorage.setItem(`deleted_${day}`,JSON.stringify(del));} render();}
}
function addTaskBox(day){
  const input=document.getElementById(`input_${day}`); const val=input.value.trim(); if(!val){alert('Isi nama kotak'); return;}
  const added=getAddedTasks(day); added.push(val); localStorage.setItem(`added_${day}`,JSON.stringify(added)); input.value=''; render();
}
function setStatus(day,idx,val,isAdded){
  const key=isAdded?`status_${day}_add_${idx}`:`status_${day}_${idx}`; const cur=localStorage.getItem(key); if(cur===val) localStorage.removeItem(key); else localStorage.setItem(key,val); render();
}
render();

function exportPDF(){
 const doc=new jsPDF(); const hariIni=getHariIni(); const tglTanpaJam=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); const tglFile=new Date().toISOString().slice(0,10);
 doc.setFillColor(15,81,50); doc.rect(0,0,210,30,'F'); doc.setTextColor(255,255,255); doc.setFontSize(13); doc.setFont(undefined,'bold'); doc.text("KDKMP DESA KASIH",10,12); doc.setFontSize(9); doc.setFont(undefined,'normal'); doc.text(`Laporan Hari ke-${hariIni} - ${tglTanpaJam}`,10,19); doc.text(`Start: ${getStartDateObj().toLocaleDateString('id-ID')}`,10,24);
 function getAllTasks(){
   const all=[...baseDays,...getCustomDays()].sort((a,b)=>a.d-b.d); const rows=[];
   all.forEach(day=>{
     const del=getDeletedTasks(day.d); const add=getAddedTasks(day.d);
     day.tasks.forEach((orig,i)=>{if(del.includes(i)) return; const text=getTaskText(day.d,i,orig); const chk=localStorage.getItem(`v13_${day.d}_${i}`)==='1'?'✓':''; const status=getStatus(day.d,i)||'-'; rows.push([`Hari ${day.d}`,day.t,day.m,text,chk,status]);});
     add.forEach((t,i)=>{const chk=localStorage.getItem(`v13_${day.d}_add_${i}`)==='1'?'✓':''; const status=localStorage.getItem(`status_${day.d}_add_${i}`)||'-'; rows.push([`Hari ${day.d}`,day.t,day.m,`➕ ${t}`,chk,status]);});
   }); return rows;
 }
