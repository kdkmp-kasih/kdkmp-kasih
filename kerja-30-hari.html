<script>
const { jsPDF } = window.jspdf;
let currentTab=1;
function switchTab(n){currentTab=n; document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{document.getElementById(id).className=(i+1===n)?'px-4 py-2 rounded-lg text-[11px] font-bold bg-white text-[#0f5132]':'px-4 py-2 rounded-lg text-[11px] font-bold bg-white/20 text-white';});}
function getStartDateObj(){const s=localStorage.getItem('kdkmp_startDate'); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const start=getStartDateObj(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1, Math.floor((now-start)/86400000)+1);}
function saveNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>localStorage.setItem('need'+k,document.getElementById('need'+k).checked));}
function loadNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('need'+k); if(v!==null) document.getElementById('need'+k).checked=v==='true'; else document.getElementById('need'+k).checked=(k==='Manajer'||k==='Kades'||k==='Cap'||k==='CapKades'||k==='Ketua'||k==='CapKetua');});}
function saveNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);});}
function loadNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('nama'+k); if(v){const el=document.getElementById('nama'+k); if(el) el.value=v;} else if(k==='Kades'){document.getElementById('namaKades').value='Supriyadi';}});}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap','capKades':'prevCapKades','capKetua':'prevCapKetua','ttdKetua':'prevKetua','ttdPengawas':'prevPengawas'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d){e.src=d; e.classList.remove('hidden');} else e.classList.add('hidden');});}
loadNeed(); loadNames(); loadImgs();
function getCustomDays(){return JSON.parse(localStorage.getItem('customDays')||'[]');}
function getDeleted(day){return JSON.parse(localStorage.getItem(`deleted_${day}`)||'[]');}
function getAdded(day){return JSON.parse(localStorage.getItem(`added_${day}`)||'[]');}
function getText(day,idx,def){return localStorage.getItem(`custom_text_${day}_${idx}`)||def;}
function getStatus(day,idx,isAdd){return localStorage.getItem(isAdd?`status_${day}_add_${idx}`:`status_${day}_${idx}`)||'';}
function isChecked(day,idx,isAdd){const prefixes=['v21','v20','v19','v18','v17']; for(let p of prefixes){const key=isAdd?`${p}_${day}_add_${idx}`:`${p}_${day}_${idx}`; if(localStorage.getItem(key)==='1') return true;} return false;}
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
];

function render(){
 const startObj=getStartDateObj(); const hariIni=getHariIni();
 document.getElementById('tgl').innerText=`Start: ${startObj.toLocaleDateString('id-ID')} | Hari ke-${hariIni}`;
 const all=[...baseDays,...getCustomDays()]; let total=0,done=0; all.forEach(d=>{const del=getDeleted(d.d); const add=getAdded(d.d); total+=d.tasks.length-del.length+add.length; d.tasks.forEach((_,i)=>{if(!del.includes(i)&&isChecked(d.d,i,false)) done++;}); add.forEach((_,i)=>{if(isChecked(d.d,i,true)) done++;});});
 const persen=total?Math.round(done/total*100):0; document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'%';

 function renderContainer(days, containerId){
   const container=document.getElementById(containerId); container.innerHTML='';
   days.sort((a,b)=>a.d-b.d).forEach(day=>{
     const deleted=getDeleted(day.d); const added=getAdded(day.d); let html='';
     day.tasks.forEach((orig,i)=>{if(deleted.includes(i)) return; const key=`v21_${day.d}_${i}`; const text=getText(day.d,i,orig); const chk=isChecked(day.d,i,false); const status=getStatus(day.d,i,false); html+=`<div class="flex items-center gap-2 py-2 px-2 border-b"><input type="checkbox" data-key="${key}" data-day="${day.d}" data-idx="${i}" data-add="0" ${chk?'checked':''} class="w-5 h-5"><span class="flex-1 text-[12px]">${text}</span><div class="flex gap-1"><button onclick="setStatus(${day.d},${i},'ADA',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button><button onclick="setStatus(${day.d},${i},'TIDAK',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button><button onclick="setStatus(${day.d},${i},'BELUM',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button></div></div>`;});
     added.forEach((t,i)=>{const key=`v21_${day.d}_add_${i}`; const chk=isChecked(day.d,i,true); const status=getStatus(day.d,i,true); let clean=t.trim().replace(/^[+\-`'"]+/, '').trim().replace(/\s+/g,' '); html+=`<div class="flex items-center gap-2 py-2 px-2 border-b bg-blue-50/40"><input type="checkbox" data-key="${key}" data-day="${day.d}" data-idx="${i}" data-add="1" ${chk?'checked':''} class="w-5 h-5"><span class="flex-1 text-[12px]">${clean}</span><div class="flex gap-1"><button onclick="setStatus(${day.d},${i},'ADA',true)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button></div></div>`;});
     const isToday=day.d===hariIni; const color=day.m==='RUMAH'?'bg-blue-100 text-blue-700':day.m==='DESA'?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700';
     const noteActive=localStorage.getItem(`noteActive_${day.d}`)==='1'; const noteText=localStorage.getItem(`note_${day.d}`)||'';
     const div=document.createElement('div'); div.className=`bg-white p-3 rounded-xl border ${isToday?'ring-2 ring-[#0f5132]':''}`; div.innerHTML=`<div class="flex justify-between items-center mb-2"><p class="font-bold text-[12px]">${isToday?'👉 ':''}HARI ${day.d}: ${day.t}</p><span class="text-[9px] px-2 py-0.5 rounded-full ${color}">${day.m}</span></div><div class="border rounded-lg overflow-hidden">${html}</div><div class="flex gap-2 mt-2"><input id="input_${day.d}" placeholder="Tambah kotak (tanpa +)" class="flex-1 border rounded p-2 text-[11px]"><button onclick="addTaskBox(${day.d})" class="bg-[#0f5132] text-white px-3 py-2 rounded text-[11px]">+ Kotak</button></div><div class="mt-3 bg-amber-50/50 p-3 rounded-lg"><div class="flex justify-between"><p class="font-bold text-[11px]">Catatan Hari ${day.d}</p><label class="text-[10px]"><input type="checkbox" id="checkNote_${day.d}" ${noteActive?'checked':''} onchange="toggleNote(${day.d})"> Aktif</label></div><textarea id="note_${day.d}" class="w-full border rounded p-2 text-[11px] h-16 mt-2" ${!noteActive?'disabled':''} oninput="saveNote(${day.d})">${noteText}</textarea></div>`;
     container.appendChild(div);
   });
 }
 renderContainer(baseDays,'container1'); renderContainer(getCustomDays(),'container2');
 document.querySelectorAll('#container1 input[type=checkbox], #container2 input[type=checkbox]').forEach(cb=>{if(cb.id.startsWith('checkNote_')) return; cb.addEventListener('change',e=>{const key=`v21_${e.target.dataset.day}${e.target.dataset.add==='1'?'_add':''}_${e.target.dataset.idx}`; localStorage.setItem(key,e.target.checked?'1':'0');});});
}
function toggleNote(d){localStorage.setItem(`noteActive_${d}`,document.getElementById(`checkNote_${d}`).checked?'1':'0'); render();}
function saveNote(d){localStorage.setItem(`note_${d}`,document.getElementById(`note_${d}`).value);}
function addTaskBox(d){let v=document.getElementById(`input_${d}`).value.trim(); if(!v) return; v=v.replace(/^[+\-`'"]+/, '').trim(); const ad=getAdded(d); ad.push(v); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); document.getElementById(`input_${d}`).value=''; render();}
function setStatus(d,i,v,a){const k=a?`status_${d}_add_${i}`:`status_${d}_${i}`; const cur=localStorage.getItem(k); if(cur===v) localStorage.removeItem(k); else localStorage.setItem(k,v); render();}
function addNewDay(){const day=parseInt(document.getElementById('newDay').value); const title=document.getElementById('newTitle').value.trim(); const mode=document.getElementById('newMode').value; const raw=document.getElementById('newTasks').value.trim(); if(!day||day<31||day>60||!title||!raw){alert('Lengkapi'); return;} const tasks=raw.split('\n').map(s=>s.trim().replace(/^[+\-`'"]+/, '')).filter(Boolean); const c=getCustomDays(); c.push({d:day,t:title,m:mode,tasks}); c.sort((a,b)=>a.d-b.d); localStorage.setItem('customDays',JSON.stringify(c)); document.getElementById('newDay').value=''; document.getElementById('newTitle').value=''; document.getElementById('newTasks').value=''; render();}
render();

function exportPDF(){
 const doc=new jsPDF('l','mm','a4');
 const hariIni=getHariIni(); const tgl=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}); const tglFile=new Date().toISOString().slice(0,10);
 doc.setFillColor(15,81,50); doc.rect(0,0,297,22,'F'); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text("KDKMP KASIH",148.5,13,{align:'center'}); doc.setFontSize(9); doc.setFont('helvetica','normal'); doc.text(`Hari ke-${hariIni} - ${tgl}`,148.5,18,{align:'center'});
 const rows=[];
 [...baseDays,...getCustomDays()].sort((a,b)=>a.d-b.d).forEach(day=>{
   const del=getDeleted(day.d); const add=getAdded(day.d);
   day.tasks.forEach((orig,i)=>{if(del.includes(i)) return; let text=getText(day.d,i,orig).trim().replace(/\s+/g,' '); const chk=isChecked(day.d,i,false)?'SELESAI':'BELUM'; const status=getStatus(day.d,i,false)||'-'; rows.push([`Hari ${day.d}`,day.t,text,chk,status]);});
   add.forEach((t,i)=>{let clean=t.trim().replace(/^[+\-`'"]+/, '').trim().replace(/\s+/g,' '); const chk=isChecked(day.d,i,true)?'SELESAI':'BELUM'; const status=getStatus(day.d,i,true)||'-'; rows.push([`Hari ${day.d}`,day.t,clean,chk,status]);});
 });
 doc.autoTable({startY:26, head:[['HARI','JUDUL','KEGIATAN','SELESAI','KONDISI']], body:rows, theme:'grid', styles:{font:'helvetica', fontSize:8, cellPadding:2.5, overflow:'linebreak', valign:'middle', lineColor:[180,180,180], lineWidth:0.25}, headStyles:{fillColor:[15,81,50], halign:'center'}, columnStyles:{0:{cellWidth:15, halign:'center'},1:{cellWidth:30},2:{cellWidth:165},3:{cellWidth:20, halign:'center'},4:{cellWidth:20, halign:'center'}}, didParseCell:function(d){if(d.section==='body'&&d.column.index===3&&d.cell.raw==='SELESAI'){d.cell.styles.fillColor=[220,252,231]; d.cell.styles.textColor=[22,101,52]; d.cell.styles.fontStyle='bold';}}});

 // TTD 1 BARIS LURUS 3 KOLOM
