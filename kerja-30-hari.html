<html lang="id">
<head>

<body class="bg-[#f8fafc]">

<div class="text-right"><div class="w-28 h-2 bg-white/20 rounded-full"><div id="progressBar" class="h-2 bg-yellow-300 rounded-full" style="width:0%"></div></div><p id="progressText" class="text-[10px] font-bold">0%</p><p id="sisaText" class="text-[9px]">Sisa 0</p></div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3 space-y-3">

<a href="./" class="mt-2 inline-block text-xs underline">Kembali ke Dashboard</a>
</div>
</div>

<script>
let hargaData = JSON.parse(localStorage.getItem('hargaV5')||`[
{"nama":"Beras SPHP 5kg HET Jawa","harga":"Rp62.500","sumber":"HET Rp12.500/kg - Bapanas No 34/2026 - badanpangan.go.id"},
{"nama":"Beras SPHP Gudang Jawa","harga":"Rp11.000/kg","sumber":"bulog.co.id - Zona 1"},
{"nama":"Beras Pasar Kasih - Warung 1","harga":"","sumber":"WA Nama Warung + Tanggal"},
{"nama":"Beras Pasar Kasih - Warung 2","harga":"","sumber":"WA Nama Warung + Tanggal"},
{"nama":"Beras Pasar Kasih - Warung 3","harga":"","sumber":"WA Nama Warung + Tanggal"},
{"nama":"Minyak Kita Pasar Kasih","harga":"","sumber":"WA Warung + Tanggal"},
{"nama":"Gula Pasar Kasih","harga":"","sumber":"WA Warung + Tanggal"}
]`);
function saveHarga(){localStorage.setItem('hargaV5',JSON.stringify(hargaData)); renderHarga();}
function renderHarga(){
 const w=document.getElementById('hargaList'); w.innerHTML='';
 hargaData.forEach((h,i)=>{
  const d=document.createElement('div');
  d.className='bg-white border rounded p-2 grid grid-cols-12 gap-1';
  d.innerHTML=`<input value="${h.nama}" oninput="hargaData[${i}].nama=this.value; saveHarga()" class="col-span-4 border p-1 rounded text-[11px]"><input value="${h.harga}" oninput="hargaData[${i}].harga=this.value; saveHarga()" class="col-span-2 border p-1 rounded text-[11px] bg-green-50"><input value="${h.sumber}" oninput="hargaData[${i}].sumber=this.value; saveHarga()" class="col-span-5 border p-1 rounded text-[11px] bg-yellow-50"><button onclick="hargaData.splice(${i},1); saveHarga()" class="col-span-1 text-red-600 text-[11px]">x</button>`;
  w.appendChild(d);
 });
}
function addHarga(){hargaData.push({nama:'',harga:'',sumber:''}); saveHarga();}
renderHarga();

const days=[
{d:1,t:"Data Kontak Desa",m:"RUMAH - WA",tasks:["☐ Simpan No WA Kepala Desa Kasih","☐ Simpan No WA Sekretaris Desa","☐ Simpan No WA Ketua Kopdes","☐ Simpan No WA Bendahara Kopdes","☐ Simpan No WA Pengawas / Kadus","☐ Bikin Folder HP: Dokumen KDKMP Kasih"]},
{d:2,t:"Data Dokumen",m:"RUMAH",tasks:["☐ Foto/scan SK Manager (minta via WA Kades)","☐ Foto/scan AD/ART Kopdes","☐ Catat NIB Kopdes","☐ Catat Nama Lengkap Ketua Kopdes","☐ Catat Nama Sekretaris","☐ Catat Nama Bendahara"]},
{d:3,t:"Data Harga Resmi + Pasar",m:"RUMAH - ONLINE",tasks:["☐ Screenshot HET Jawa Rp12.500 dari badanpangan.go.id - isi di tracker atas","☐ Screenshot harga gudang Rp11.000 dari bulog.co.id","☐ Tanya harga beras Warung 1 di Kasih via WA - isi tracker + sumber","☐ Tanya harga beras Warung 2 via WA - isi tracker + sumber","☐ Tanya harga beras Warung 3 via WA - isi tracker + sumber","☐ Hitung selisih HET vs Pasar"]},
{d:4,t:"Poster Harga",m:"RUMAH - HP",tasks:["☐ Bikin poster Canva: Beras SPHP Rp62.500 + tulis sumber Bapanas","☐ Bikin poster Minyak Kita (jika ada harga)","☐ Simpan JPG poster","☐ Siapkan file siap print A4"]},
{d:5,t:"Jadwal Kunjungan",m:"RUMAH",tasks:["☐ Tentukan hari tetap: Jumat jam 10.00","☐ Tentukan durasi: 30 menit saja","☐ Siapkan buku tamu kecil","☐ Siapkan kalimat izin sopan 10 menit"]},
{d:6,t:"Data Supplier Online",m:"RUMAH - ONLINE",tasks:["☐ Buka bulog.co.id - baca syarat mitra Klik SPHP","☐ Screenshot syarat - simpan","☐ Cari kontak agen LPG Kertanegara via Google Maps - catat","☐ Cari kontak ID Food Jateng - catat (jangan hubungi dulu)"]},
{d:7,t:"Laporan Minggu 1",m:"RUMAH - WA",tasks:["☐ Ketik laporan 5 baris progres data","☐ Lampirkan screenshot sumber harga","☐ Lampirkan poster harga","☐ Kirim WA ke Kades","☐ Minta izin datang Jumat 30 menit"]},
{d:8,t:"KUNJUNGAN #1 - 30 Menit",m:"DESA",tasks:["☐ Datang pakai baju rapi","☐ Bawa buku tamu","☐ Foto gerai dari luar (2 foto)","☐ Catat kondisi listrik gerai: ada/tidak","☐ Catat kondisi rak gerai: ada/tidak","☐ Pamit sopan - jangan minta kunci"]},
{d:9,t:"Evaluasi Gerai",m:"RUMAH",tasks:["☐ Tulis catatan kondisi gerai","☐ Tulis kekurangan gerai (list)","☐ Upload foto gerai ke HP","☐ Update website jika bisa"]},
{d:10,t:"Belajar SOP",m:"RUMAH",tasks:["☐ Baca PDF sosialisasi KDKMP","☐ Catat 3 kewajiban manager pra-buka","☐ Catat larangan manager pra-buka","☐ Tanya grup manajer Purbalingga pengalaman"]},
{d:11,t:"SOP Kasir",m:"RUMAH",tasks:["☐ Bikin format nota penjualan di Notes HP","☐ Bikin format stok masuk","☐ Bikin format stok keluar","☐ Bikin format laporan tutup kas harian","☐ Bikin template WA lapor ke Kades"]},
{d:12,t:"Riset Warga",m:"RUMAH - WA",tasks:["☐ Tanya Warga 1: belanja dimana?","☐ Tanya Warga 2: belanja dimana?","☐ Tanya Warga 3: belanja dimana?","☐ Catat jam buka warung ramai","☐ Catat produk yang belum ada di Kasih"]},
{d:13,t:"Denah Gerai",m:"RUMAH",tasks:["☐ Gambar denah di kertas A4","☐ Tentukan posisi rak beras","☐ Tentukan posisi LPG","☐ Tentukan posisi kasir","☐ Foto denah"]},
{d:14,t:"Laporan Minggu 2",m:"RUMAH - WA",tasks:["☐ Kirim foto kunjungan #1","☐ Kirim denah gerai","☐ Kirim template kasir","☐ Kirim tracker harga terbaru","☐ WA Kades: mohon arahan"]},
{d:15,t:"KUNJUNGAN #2 - 40 Menit",m:"DESA",tasks:["☐ Print poster harga (1 lembar)","☐ Print denah gerai (1 lembar)","☐ Datang bawa poster + denah","☐ Minta pendapat Kades (bukan minta dana)","☐ Foto bareng poster"]},
{d:16,t:"Simulasi Modal",m:"RUMAH",tasks:["☐ Hitung: HET 12.500 - gudang 11.000 = margin 1.500/kg","☐ Hitung: 20 karung x 5kg x 1.500 = laba kotor","☐ Hitung biaya plastik","☐ Hitung biaya transport simulasi","☐ Catat tanpa pakai uang pribadi dulu"]},
{d:17,t:"Grup WA Pelanggan",m:"RUMAH",tasks:["☐ Bikin Grup WA Info Harga KDKMP Kasih","☐ Undang Ibu PKK 1","☐ Undang Ibu PKK 2","☐ Undang Ibu PKK 3","☐ Undang 7 warga lain (total 10)","☐ Posting poster + sumber harga di grup"]},
{d:18,t:"Konten Edukasi",m:"RUMAH - HP",tasks:["☐ Bikin video 15 detik: HET 12.500 segera hadir","☐ Sebut sumber di video: Bapanas No 34/2026","☐ Posting Status WA","☐ Posting di Grup WA"]},
{d:19,t:"Keuangan Awal",m:"RUMAH",tasks:["☐ Hitung laba kotor simulasi","☐ Hitung biaya operasional","☐ Hitung BEP (balik modal)","☐ Catat di Notes HP"]},
{d:20,t:"Checklist Buka",m:"RUMAH",tasks:["☐ List buku stok: sudah/belum","☐ List buku kas: sudah/belum","☐ List kalkulator: sudah/belum","☐ List plastik karung: sudah/belum","☐ List pulpen/nota: sudah/belum"]},
{d:21,t:"Laporan Minggu 3",m:"RUMAH - WA",tasks:["☐ Kirim RAB simulasi","☐ Kirim screenshot Grup WA 10 orang","☐ Kirim konten video","☐ Kirim tracker harga lengkap + sumber","☐ Tanya Kades: bisa dibahas rapat?"]},
{d:22,t:"Standby",m:"RUMAH",tasks:["☐ Rapikan semua catatan harga + sumber","☐ Jawab chat warga di grup","☐ Update website foto baru"]},
{d:23,t:"KUNJUNGAN #3 Rapat",m:"DESA - 60 MENIT",tasks:["☐ Datang jika diundang rapat","☐ Bawa print laporan 3 minggu","☐ Presentasi 5 menit: data kontak + harga bersumber + denah","☐ Minta keputusan: target tanggal soft opening","☐ Catat hasil rapat"]},
{d:24,t:"Timeline H-7",m:"RUMAH",tasks:["☐ Bikin checklist final apa yang disiapkan desa","☐ Bikin checklist apa yang kamu siapkan","☐ Bikin timeline 7 hari menuju buka","☐ Share checklist via WA ke Kades"]},
{d:25,t:"Gladi Resik",m:"RUMAH",tasks:["☐ Simulasi timbang beras 5kg","☐ Simulasi catat nota","☐ Simulasi hitung kembalian","☐ Simulasi tutup kas harian","☐ Siapkan kemeja rapi"]},
{d:26,t:"Promo H-3",m:"RUMAH - WA",tasks:["☐ Posting H-3 di Grup WA","☐ Chat personal 10 warga: mohon doa mau buka","☐ Chat personal 10 warga lagi","☐ Siapkan daftar antrian jika perlu"]},
{d:27,t:"H-1 Persiapan",m:"DESA - 60 MENIT",tasks:["☐ Datang pasang poster harga + tulis sumber di pojok poster","☐ Bersihkan rak","☐ Tata rak sedikit","☐ Foto final gerai siap buka (3 foto)"]},
{d:28,t:"SOFT OPENING",m:"DESA",tasks:["☐ Buka jam 08.00-11.00 (3 jam saja)","☐ Jual terbatas: SPHP saja","☐ Catat semua transaksi di buku","☐ Foto dokumentasi: pembeli + stok","☐ Foto nota hari pertama"]},
{d:29,t:"Evaluasi Hari 1",m:"RUMAH",tasks:["☐ Hitung laba rugi hari 1","☐ Catat komplain warga 1","☐ Catat komplain warga 2","☐ Catat stok kurang apa","☐ Kirim laporan singkat ke Kades via WA"]},
{d:30,t:"Laporan 30 Hari",m:"RUMAH",tasks:["☐ Klik Export Laporan di website ini","☐ Kirim TXT ke Kades","☐ Kirim TXT ke Korwil Kertanegara","☐ Kirim TXT ke Dinkop Purbalingga","☐ Tulis rencana Bulan 2: tambah LPG & Minyak Kita"]},
];

const container=document.getElementById('container');
function render(){
 container.innerHTML=''; let total=0,done=0;
 days.forEach(day=>{
   let html=day.tasks.map((t,i)=>{
     const key=`v5_${day.d}_${i}`; const chk=localStorage.getItem(key)==='1'; if(chk)done++; total++;
     return `<label class="flex gap-2 items-start py-1.5 px-2 rounded hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-0">
       <input type="checkbox" data-key="${key}" ${chk?'checked':''} class="mt-0.5 w-4 h-4">
       <span class="text-[11px] ${chk?'line-through text-slate-400':''}">${t.replace('☐','')}</span>
     </label>`;
   }).join('');
   const sisa=day.tasks.length - day.tasks.filter((_,i)=>localStorage.getItem(`v5_${day.d}_${i}`)==='1').length;
   const div=document.createElement('div');
   div.className='bg-white p-3 rounded-xl border shadow-sm';
   div.innerHTML=`
    <div class="flex justify-between items-center">
      <p class="font-bold text-[12px]">HARI ${day.d}: ${day.t}</p>
      <span class="text-[9px] px-2 py-0.5 rounded-full ${day.m.includes('RUMAH')?'bg-blue-100 text-blue-700':'bg-orange-100 text-orange-700'}">${day.m}</span>
    </div>
    <div class="mt-1 flex gap-2">
      <span class="text-[9px] px-2 py-0.5 rounded-full bg-slate-100">${day.tasks.length} data</span>
      <span class="text-[9px] px-2 py-0.5 rounded-full ${sisa===0?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${sisa===0?'Tuntas '+day.tasks.length+'/'+day.tasks.length:'Sisa '+sisa+' dari '+day.tasks.length+' belum'}</span>
    </div>
    <div class="mt-2 bg-slate-50 rounded-lg border">${html}</div>
    <textarea id="note${day.d}" placeholder="Catatan hari ${day.d}..." class="mt-2 w-full border rounded p-2 text-[11px] h-12">${localStorage.getItem('noteV5_'+day.d)||''}</textarea>
   `;
   container.appendChild(div);
 });
 document.getElementById('progressBar').style.width=(total?Math.round(done/total*100):0)+'%';
 document.getElementById('progressText').innerText=(total?Math.round(done/total*100):0)+'%';
 document.getElementById('sisaText').innerText='Sisa '+(total-done)+' dari '+total+' data belum';
 container.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{localStorage.setItem(e.target.dataset.key,e.target.checked?'1':'0'); render();}));
 container.querySelectorAll('textarea').forEach(ta=>ta.addEventListener('input',e=>{localStorage.setItem('noteV5_'+e.target.id.replace('note',''),e.target.value);}));
}
render();
function exportLaporan(){
 let txt=`LAPORAN 30 HARI V5 - KDKMP KASIH - TANPA PARAF - DATA DIPISAH\nID 33.03.18.2008 - ${new Date().toLocaleString('id-ID')}\n\n== HARGA + SUMBER ==\n`;
 hargaData.forEach(h=>{txt+=`- ${h.nama} | ${h.harga} | Sumber: ${h.sumber}\n`;});
 txt+=`\n== RINCIAN PER HARI - DATA DIPISAH ==\n`;
 days.forEach(day=>{
   txt+=`\nHARI ${day.d} - ${day.t} (${day.m})\n`;
   day.tasks.forEach((t,i)=>{txt+=` ${localStorage.getItem(`v5_${day.d}_${i}`)==='1'?'[✓]':'[ ]'} ${t.replace('☐','')}\n`;});
   txt+=` Catatan: ${localStorage.getItem('noteV5_'+day.d)||'-'}\n`;
 });
 const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Laporan-V5-Data-Dipisah-KDKMP-Kasih.txt'; a.click();
}
</script>
</body>
</html>
