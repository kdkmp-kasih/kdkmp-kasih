<body class="bg-[#f8fafc]">

<div id="content3" class="hidden space-y-3">
<div class="bg-white border-2 border-[#0f5132] p-4 rounded-xl">
<p class="font-bold text-[13px]">TTD + CAP + NAMA (Web V18 Asli)</p>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
<div class="border-2 border-orange-300 p-3 rounded-xl bg-orange-50"><p class="font-bold text-[11px]">BLOK KADES - Cap di posisi Kades</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">TTD Kades</p><input id="namaKades" placeholder="Nama Kades" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdKades')"><img id="prevKades" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needKades" checked onchange="saveNeed()"> Tampilkan</label></div><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">Cap Kades</p><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'capKades')"><img id="prevCapKades" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needCapKades" checked onchange="saveNeed()"> Tampilkan</label></div></div></div>
<div class="border-2 border-green-300 p-3 rounded-xl bg-green-50"><p class="font-bold text-[11px]">BLOK MANAJER - Cap di posisi Manajer</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">TTD Manajer</p><input id="namaManajer" placeholder="Nama Manajer" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdManajer')"><img id="prevManajer" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needManajer" checked onchange="saveNeed()"> Tampilkan</label></div><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">Cap KDKMP</p><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'capKoperasi')"><img id="prevCap" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needCap" checked onchange="saveNeed()"> Tampilkan</label></div></div></div>
<div class="border-2 border-blue-300 p-3 rounded-xl bg-blue-50"><p class="font-bold text-[11px]">BLOK KETUA - Cap di posisi Ketua</p><div class="grid grid-cols-2 gap-2 mt-2"><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">TTD Ketua</p><input id="namaKetua" placeholder="Nama Ketua" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdKetua')"><img id="prevKetua" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needKetua" onchange="saveNeed()"> Aktif</label></div><div class="bg-white p-2 rounded border"><p class="text-[10px] font-bold">Cap Ketua</p><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'capKetua')"><img id="prevCapKetua" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needCapKetua" onchange="saveNeed()"> Tampilkan</label></div></div></div>
<div class="border p-3 rounded-xl bg-slate-50"><p class="font-bold text-[11px]">Pengawas (Baris ke-2)</p><input id="namaPengawas" placeholder="Nama Pengawas" class="w-full border rounded p-1 text-[10px] mt-1" oninput="saveNames()"><input type="file" accept="image/*" class="text-[8px] w-full mt-1" onchange="saveImg(this,'ttdPengawas')"><img id="prevPengawas" class="w-full h-16 object-contain mt-1 border hidden"><label class="text-[9px]"><input type="checkbox" id="needPengawas" onchange="saveNeed()"> Aktif</label></div>
</div>
</div>
</div>

<div class="bg-white p-4 rounded-xl border">
<button onclick="exportPDF()" class="bg-[#0f5132] text-white px-5 py-3 rounded-lg text-xs font-bold w-full">📄 EXPORT PDF - WEB V18 FULL</button>
<p class="text-[9px] text-center mt-2 text-slate-400">Web V18 asli lengkap + PDF fix jarak</p>
</div>
</div>

<script>
const { jsPDF } = window.jspdf;
let currentTab=1;
function switchTab(n){currentTab=n; document.getElementById('content1').classList.toggle('hidden',n!==1); document.getElementById('content2').classList.toggle('hidden',n!==2); document.getElementById('content3').classList.toggle('hidden',n!==3); ['tab1','tab2','tab3'].forEach((id,i)=>{document.getElementById(id).className=(i+1===n)?'px-4 py-2 rounded-lg text-[11px] font-bold bg-white text-[#0f5132]':'px-4 py-2 rounded-lg text-[11px] font-bold bg-white/20 text-white';}); render();}
function getStoredStart(){return localStorage.getItem('kdkmp_startDate');}
function getStartDateObj(){const s=getStoredStart(); if(s){const d=new Date(s); d.setHours(0,0,0,0); return d;} const n=new Date(); n.setHours(0,0,0,0); return n;}
function getHariIni(){const start=getStartDateObj(); const now=new Date(); now.setHours(0,0,0,0); return Math.max(1, Math.floor((now-start)/86400000)+1);}
function saveNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>localStorage.setItem('need'+k,document.getElementById('need'+k).checked));}
function loadNeed(){['Manajer','Kades','Cap','CapKades','CapKetua','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('need'+k); if(v!==null) document.getElementById('need'+k).checked=v==='true'; else document.getElementById('need'+k).checked=(k==='Manajer'||k==='Kades'||k==='Cap'||k==='CapKades');});}
function saveNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const el=document.getElementById('nama'+k); if(el) localStorage.setItem('nama'+k,el.value);});}
function loadNames(){['Manajer','Kades','Ketua','Pengawas'].forEach(k=>{const v=localStorage.getItem('nama'+k); if(v!==null){const el=document.getElementById('nama'+k); if(el) el.value=v;} else if(k==='Kades'){document.getElementById('namaKades').value='Supriyadi'; localStorage.setItem('namaKades','Supriyadi');}});}
function saveImg(input,key){const f=input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{localStorage.setItem(key,e.target.result); loadImgs();}; r.readAsDataURL(f);}
function loadImgs(){const map={'ttdManajer':'prevManajer','ttdKades':'prevKades','capKoperasi':'prevCap','capKades':'prevCapKades','capKetua':'prevCapKetua','ttdKetua':'prevKetua','ttdPengawas':'prevPengawas'}; Object.entries(map).forEach(([k,el])=>{const d=localStorage.getItem(k); const e=document.getElementById(el); if(d){e.src=d; e.classList.remove('hidden');} else e.classList.add('hidden');});}
loadNeed(); loadNames(); loadImgs();
function getCustomDays(){return JSON.parse(localStorage.getItem('customDays')||'[]');}
function getDeleted(day){return JSON.parse(localStorage.getItem(`deleted_${day}`)||'[]');}
function getAdded(day){return JSON.parse(localStorage.getItem(`added_${day}`)||'[]');}
function getText(day,idx,def){return localStorage.getItem(`custom_text_${day}_${idx}`)||def;}
function getStatus(day,idx,isAdd){return localStorage.getItem(isAdd?`status_${day}_add_${idx}`:`status_${day}_${idx}`)||'';}
function isChecked(day,idx,isAdd){const prefixes=['v28','v27','v26','v25','v24','v23','v22','v21','v20','v19','v18','v17','v16']; for(let p of prefixes){const key=isAdd?`${p}_${day}_add_${idx}`:`${p}_${day}_${idx}`; if(localStorage.getItem(key)==='1') return true;} return false;}
const baseDays=[
{d:1,t:"Laporan Diri Tingkat Desa",m:"DESA",tasks:["Melaporkan keberadaan kepada Kepala Desa","Melaporkan kepada Lurah","Serah terima penugasan kepada Pengurus","Perkenalkan diri sebagai Manajer","Catat kontak Kades","Melaporkan kepada Babinsa","Catat kontak babinsa","Catat kontak ketua pengurus"]},
{d:2,t:"Silaturahmi",m:"DESA",tasks:["Silaturahmi Ketua BPD","Silaturahmi Anggota BPD","Silaturahmi Tokoh Masyarakat","Silaturahmi Ketua RT","Silaturahmi Ketua RW","Sampaikan visi inklusif","Sampaikan visi kolaboratif","Sampaikan visi transparan","Catat aspirasi"]},
{d:3,t:"Inventarisasi Aset",m:"GERAI",tasks:["Periksa kantor koperasi","Catat ukuran kantor","Periksa mesin/peralatan","Catat kondisi mesin","Periksa persediaan barang","Catat stok barang","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi",m:"RUMAH",tasks:["Periksa dokumen legalitas","Periksa buku rekening bank","Periksa arsip keuangan","Test login SIMKOPDES","Pastikan SIMKOPDES lancar"]},
{d:5,t:"Pemetaan Anggota",m:"RUMAH",tasks:["Kumpulkan data anggota aktif","Kumpulkan data anggota pasif","Data calon anggota potensial","Rekap jumlah anggota","Siapkan untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi",m:"RUMAH",tasks:["Tinjau data Desil wilayah","Identifikasi kelompok sasaran","Petakan potensi ekonomi","Catat kelompok tani/nelayan"]},
{d:7,t:"BAST Minggu 1",m:"RUMAH",tasks:["Susun BAST Aset","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Anggota",m:"RUMAH",tasks:["Input data keanggotaan","Update data keanggotaan","Input profil KDKMP","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",m:"RUMAH",tasks:["Tata alur pembukuan","Sesuaikan dengan standar SIMKOPDES","Input saldo kas","Input saldo bank"]},
{d:10,t:"Integrasi Privy",m:"RUMAH",tasks:["Pastikan ttd dokumen terintegrasi","Pastikan kontrak terintegrasi Privy","Uji coba Privy"]},
{d:11,t:"SOP Kas",m:"RUMAH",tasks:["Susun SOP kas kecil","Susun SOP penerimaan","Susun SOP laporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",m:"RUMAH",tasks:["SOP pendaftaran anggota baru","SOP simpanan","SOP prosedur pengajuan","SOP pengelolaan stok","SOP perdagangan/waserda"]},
{d:13,t:"Persiapan Rapat",m:"RUMAH",tasks:["Siapkan materi pemetaan","Siapkan draf SOP","Buat undangan Pengurus","Buat undangan Pengawas"]},
{d:14,t:"Rapat Konsolidasi",m:"DESA",tasks:["Presentasi pemetaan ke Pengurus","Presentasi SOP ke Pengawas","Sepakati Q1 Targets","Deliverable SIMKOPDES & SOP"]},
{d:15,t:"Quick Win Sembako",m:"RUMAH",tasks:["Tentukan Quick Win","Daftar kebutuhan pokok","Cek harga bersaing","Koordinasi 1 pintu Agrinas"]},
{d:16,t:"Quick Win Pertanian & PPOB",m:"RUMAH",tasks:["Data kebutuhan pupuk","Data kebutuhan pakan","Data kebutuhan bibit","Layanan listrik","Layanan air","Layanan BPJS"]},
{d:17,t:"Pencatatan Real-time",m:"GERAI",tasks:["Catat transaksi Quick Win real-time","Cek stok harian","Cek kas harian"]},
{d:18,t:"Sosialisasi Forum",m:"DESA",tasks:["Sosialisasi rembug warga","Sosialisasi pengajian","Sosialisasi RWT/RTL"]},
{d:19,t:"Edukasi Keanggotaan",m:"DESA",tasks:["Jelaskan hak anggota","Jelaskan kewajiban","Jelaskan keuntungan","Jelaskan SHU","Jelaskan akses usaha"]},
{d:20,t:"Posko Pendaftaran",m:"DESA",tasks:["Buka posko pendaftaran","Tentukan lokasi strategis","Bagi formulir","Catat calon anggota"]},
{d:21,t:"Deliverable Minggu 3",m:"GERAI",tasks:["Evaluasi layanan Quick Win","Hitung anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",m:"RUMAH",tasks:["Cocokkan kas fisik","Cocokkan rekening bank","Cocokkan SIMKOPDES","Catat selisih"]},
{d:23,t:"Laporan Keuangan",m:"RUMAH",tasks:["Susun Laba/Rugi","Susun Neraca Kas","Susun Perkembangan Anggota"]},
{d:24,t:"Analisis",m:"RUMAH",tasks:["Analisis omzet","Analisis margin","Analisis animo warga"]},
{d:25,t:"Persiapan Eksternal",m:"RUMAH",tasks:["Siapkan Laporan Kinerja Manajer","Siapkan data Dinkop","Siapkan data Kementerian"]},
{d:26,t:"Pelaporan Eksternal",m:"RUMAH",tasks:["Kirim ke Dinkop","Kirim ke Kementerian","Hubungi Pendamping","Hubungi Pembina"]},
{d:27,t:"Diskusi",m:"RUMAH",tasks:["Diskusi dengan Pendamping","Catat masukan","Catat arahan"]},
{d:28,t:"Persiapan Evaluasi",m:"RUMAH",tasks:["Siapkan materi evaluasi","Daftar capaian","Daftar kendala"]},
{d:29,t:"Rapat Evaluasi",m:"DESA",tasks:["Rapat dengan Pengurus","Bahasa capaian 30 hari","Catat masukan"]},
{d:30,t:"Rencana Bulan 2",m:"RUMAH",tasks:["Susun Rencana Bulan 2","Fokus unit usaha baru","Rencana kemitraan","Rencana permodalan","Finalisasi Laporan Resmi","Finalisasi Master Plan","Export untuk Kades","Export untuk Korwil","Export untuk Dinas"]},
];
function render(){
 const startObj=getStartDateObj(); const hariIni=getHariIni();
 document.getElementById('tgl').innerText=`Start: ${startObj.toLocaleDateString('id-ID')} | Hari ke-${hariIni}`;
 const all=[...baseDays,...getCustomDays()]; let total=0,done=0; all.forEach(d=>{const del=getDeleted(d.d); const add=getAdded(d.d); total+=d.tasks.length-del.length+add.length; d.tasks.forEach((_,i)=>{if(!del.includes(i)&&isChecked(d.d,i,false)) done++;}); add.forEach((_,i)=>{if(isChecked(d.d,i,true)) done++;});});
 const persen=total?Math.round(done/total*100):0; document.getElementById('bar').style.width=persen+'%'; document.getElementById('txt').innerText=persen+'% ('+done+'/'+total+')';
 function renderContainer(days, containerId){
   const container=document.getElementById(containerId); container.innerHTML='';
   days.sort((a,b)=>a.d-b.d).forEach(day=>{
     const deleted=getDeleted(day.d); const added=getAdded(day.d); let html='';
     day.tasks.forEach((orig,i)=>{
       if(deleted.includes(i)) return;
       const text=getText(day.d,i,orig);
       const chk=isChecked(day.d,i,false);
       const status=getStatus(day.d,i,false);
       html+=`<div class="flex items-center gap-2 py-2.5 px-2 border-b hover:bg-slate-50">
       <input type="checkbox" data-day="${day.d}" data-idx="${i}" data-add="0" ${chk?'checked':''} class="w-5 h-5 shrink-0">
       <span class="flex-1 text-[12px] ${chk?'line-through text-slate-400':''}">${text}</span>
       <div class="flex gap-1 shrink-0 items-center">
         <button onclick="setStatus(${day.d},${i},'ADA',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button>
         <button onclick="setStatus(${day.d},${i},'TIDAK',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button>
         <button onclick="setStatus(${day.d},${i},'BELUM',false)" class="text-[9px] px-2 py-1 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button>
         <button onclick="editTask(${day.d},${i},false)" class="text-[10px] bg-slate-100 hover:bg-slate-200 px-2 py-1 rounded" title="Edit">✏️</button>
         <button onclick="deleteTask(${day.d},${i},false)" class="text-[10px] bg-slate-100 hover:bg-red-100 px-2 py-1 rounded" title="Hapus">🗑️</button>
       </div>
       </div>`;
     });
     added.forEach((t,i)=>{
       let clean=t.trim().replace(/^[+\-`'"]+/, '').trim().replace(/\s+/g,' ');
       const chk=isChecked(day.d,i,true);
       const status=getStatus(day.d,i,true);
       html+=`<div class="flex items-center gap-2 py-2.5 px-2 border-b bg-blue-50/40">
       <input type="checkbox" data-day="${day.d}" data-idx="${i}" data-add="1" ${chk?'checked':''} class="w-5 h-5">
       <span class="flex-1 text-[12px] ${chk?'line-through':''}">${clean}</span>
       <div class="flex gap-1">
         <button onclick="setStatus(${day.d},${i},'ADA',true)" class="text-[9px] px-2 py-1 rounded-full border ${status==='ADA'?'bg-green-600 text-white':'bg-white'}">ADA</button>
         <button onclick="setStatus(${day.d},${i},'TIDAK',true)" class="text-[9px] px-2 py-1 rounded-full border ${status==='TIDAK'?'bg-red-600 text-white':'bg-white'}">TIDAK</button>
         <button onclick="setStatus(${day.d},${i},'BELUM',true)" class="text-[9px] px-2 py-1 rounded-full border ${status==='BELUM'?'bg-amber-500 text-white':'bg-white'}">BELUM</button>
         <button onclick="editTask(${day.d},${i},true)" class="text-[10px] bg-slate-100 px-2 py-1 rounded">✏️</button>
         <button onclick="deleteTask(${day.d},${i},true)" class="text-[10px] bg-slate-100 px-2 py-1 rounded">🗑️</button>
       </div>
       </div>`;
     });
     const isToday=day.d===hariIni; const color=day.m==='RUMAH'?'bg-blue-100 text-blue-700':day.m==='DESA'?'bg-orange-100 text-orange-700':'bg-green-100 text-green-700';
     const noteActive=localStorage.getItem(`noteActive_${day.d}`)==='1'; const noteText=localStorage.getItem(`note_${day.d}`)||'';
     const div=document.createElement('div'); div.className=`bg-white p-3 rounded-xl border ${isToday?'ring-2 ring-[#0f5132]':''}`;
     div.innerHTML=`<div class="flex justify-between items-center mb-2"><p class="font-bold text-[12px]">${isToday?'👉 ':''}HARI ${day.d}: ${day.t}</p><span class="text-[9px] px-2 py-0.5 rounded-full ${color}">${day.m}</span></div><div class="border rounded-lg overflow-hidden">${html}</div><div class="flex gap-2 mt-2"><input id="input_${day.d}" placeholder="Tambah kotak..." class="flex-1 border rounded-lg p-2 text-[11px]"><button onclick="addTaskBox(${day.d})" class="bg-[#0f5132] text-white px-4 py-2 rounded-lg text-[11px]">+ Kotak</button></div><div class="mt-3 bg-amber-50/50 p-3 rounded-lg"><div class="flex justify-between"><p class="font-bold text-[11px]">📝 Catatan Hari ${day.d}</p><label class="text-[10px] font-bold"><input type="checkbox" id="checkNote_${day.d}" ${noteActive?'checked':''} onchange="toggleNote(${day.d})"> ${noteActive?'Aktif':'Non-Aktif'}</label></div><textarea id="note_${day.d}" class="w-full border rounded-lg p-2 text-[11px] h-20 mt-2" ${!noteActive?'disabled':''} oninput="saveNote(${day.d})">${noteText}</textarea></div>`;
     container.appendChild(div);
   });
 }
 renderContainer(baseDays,'container1'); renderContainer(getCustomDays(),'container2');
 document.querySelectorAll('#container1 input[type=checkbox], #container2 input[type=checkbox]').forEach(cb=>{if(cb.id.startsWith('checkNote_')) return; cb.addEventListener('change',e=>{const key=`v28_${e.target.dataset.day}${e.target.dataset.add==='1'?'_add':''}_${e.target.dataset.idx}`; localStorage.setItem(key,e.target.checked?'1':'0'); render();});});
}
function toggleNote(day){localStorage.setItem(`noteActive_${day}`,document.getElementById(`checkNote_${day}`).checked?'1':'0'); render();}
function saveNote(day){localStorage.setItem(`note_${day}`,document.getElementById(`note_${day}`).value);}
function editTask(d,i,a){if(a){const ad=getAdded(d); const cur=ad[i]; const b=prompt('Edit:',cur); if(b!==null&&b.trim()){ad[i]=b.trim().replace(/\s+/g,' '); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); render();}} else {const def=baseDays.find(x=>x.d===d)?.tasks[i]||''; const cur=getText(d,i,def); const b=prompt('Edit:',cur); if(b===null) return; if(b.trim()===def||!b.trim()) localStorage.removeItem(`custom_text_${d}_${i}`); else localStorage.setItem(`custom_text_${d}_${i}`,b.trim().replace(/\s+/g,' ')); render();}}
function deleteTask(d,i,a){if(!confirm('Hapus kotak ini?')) return; if(a){const ad=getAdded(d); ad.splice(i,1); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); render();} else {const del=getDeleted(d); if(!del.includes(i)){del.push(i); localStorage.setItem(`deleted_${d}`,JSON.stringify(del));} render();}}
function addTaskBox(d){let v=document.getElementById(`input_${d}`).value.trim(); if(!v) return; v=v.replace(/^[+\-`'"]+/, '').trim().replace(/\s+/g,' '); const ad=getAdded(d); ad.push(v); localStorage.setItem(`added_${d}`,JSON.stringify(ad)); document.getElementById(`input_${d}`).value=''; render();}
function setStatus(d,i,v,a){const k=a?`status_${d}_add_${i}`:`status_${d}_${i}`; const cur=localStorage.getItem(k); if(cur===v) localStorage.removeItem(k); else localStorage.setItem(k,v); render();}
function addNewDay(){const day=parseInt(document.getElementById('newDay').value); const title=document.getElementById('newTitle').value.trim(); const mode=document.getElementById('newMode').value; const raw=document.getElementById('newTasks').value.trim(); if(!day||day<31||day>60||!title||!raw){alert('Lengkapi'); return;} const tasks=raw.split('\n').map(s=>s.trim().replace(/^[+\-`'"]+/, '').replace(/\s+/g,' ')).filter(Boolean); const c=getCustomDays(); c.push({d:day,t:title,m:mode,tasks}); c.sort((a,b)=>a.d-b.d); localStorage.setItem('customDays',JSON.stringify(c)); document.getElementById('newDay').value=''; document.getElementById('newTitle').value=''; document.getElementById('newTasks').value=''; render();}
render();

function drawPengesahan(doc, startY){
 const tglLong=new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 const isManajer=localStorage.getItem('needManajer')!=='false';
 const isKetua=localStorage.getItem('needKetua')!=='false';
 const isKades=localStorage.getItem('needKades')!=='false';
 const isPengawas=localStorage.getItem('needPengawas')==='true';
 const roles=[];
 if(isManajer) roles.push({key:'Manajer', label:'Manajer KDKMP Kasih', pre:'', nama:localStorage.getItem('namaManajer')||'(Nama Manajer)', ttd:localStorage.getItem('ttdManajer'), cap:localStorage.getItem('capKoperasi'), needCap:localStorage.getItem('needCap')!=='false'});
 if(isKetua) roles.push({key:'Ketua', label:'Ketua Pengurus', pre:'Mengetahui', nama:localStorage.getItem('namaKetua')||'(Nama Ketua)', ttd:localStorage.getItem('ttdKetua'), cap:localStorage.getItem('capKetua'), needCap:localStorage.getItem('needCapKetua')!=='false'});
 if(isPengawas) roles.push({key:'Pengawas', label:'Pengawas', pre:'Menyetujui', nama:localStorage.getItem('namaPengawas')||'(Nama Pengawas)', ttd:localStorage.getItem('ttdPengawas'), cap:null, needCap:false});
 if(isKades) roles.push({key:'Kades', label:'Kepala Desa Kasih', pre:'Mengesahkan', nama:localStorage.getItem('namaKades')||'Supriyadi', ttd:localStorage.getItem('ttdKades'), cap:localStorage.getItem('capKades'), needCap:localStorage.getItem('needCapKades')!=='false'});
 let displayRoles=[];
 const count=roles.length;
 if(count===2){ const manajer=roles.find(r=>r.key==='Manajer'); const other=roles.find(r=>r.key!=='Manajer'); displayRoles=[manajer,other].filter(Boolean); }
 else if(count===3){ const manajer=roles.find(r=>r.key==='Manajer'); const ketua=roles.find(r=>r.key==='Ketua'); const kades=roles.find(r=>r.key==='Kades'); displayRoles=[manajer,ketua,kades].filter(Boolean); if(displayRoles.length<3) displayRoles=roles.slice(0,3); }
 else if(count===4){ const manajer=roles.find(r=>r.key==='Manajer'); const ketua=roles.find(r=>r.key==='Ketua'); const pengawas=roles.find(r=>r.key==='Pengawas'); const kades=roles.find(r=>r.key==='Kades'); displayRoles=[manajer,ketua,pengawas,kades].filter(Boolean); }
 else { displayRoles=roles; }
 let y=startY; doc.setDrawColor(180,180,180); doc.setLineWidth(0.3); doc.line(10,y,287,y); y+=6;
 if(displayRoles.length===2){
   const colL=40, colR=160;
   doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0,0,0); doc.text(`Kasih, ${tglLong}`,colR,y); y+=4; doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(`Desa Kasih`,colR,y); y+=8;
   doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(0,0,0); if(displayRoles[0].pre) doc.text(displayRoles[0].pre,colL,y); if(displayRoles[1].pre) doc.text(displayRoles[1].pre,colR,y); y+=5;
   doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0); doc.text(displayRoles[0].label,colL,y); doc.text(displayRoles[1].label,colR,y);
   try{ if(displayRoles[0].ttd) doc.addImage(displayRoles[0].ttd,'PNG',colL,y+2,34,18); if(displayRoles[0].needCap && displayRoles[0].cap) doc.addImage(displayRoles[0].cap,'PNG',colL+38,y,20,20); if(displayRoles[1].ttd) doc.addImage(displayRoles[1].ttd,'PNG',colR,y+2,34,18); if(displayRoles[1].needCap && displayRoles[1].cap) doc.addImage(displayRoles[1].cap,'PNG',colR+38,y,20,20); }catch(e){}
   y+=26; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(displayRoles[0].nama,colL,y); doc.text(displayRoles[1].nama,colR,y); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",colL,y+3); doc.text("__________________________",colR,y+3); return y+10;
 } else if(displayRoles.length===3){
   const col1=30, col2=110, col3=190; const cols=[col1,col2,col3];
   doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0,0,0); doc.text(`Kasih, ${tglLong}`,col3,y); y+=4; doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(`Desa Kasih`,col3,y); y+=8;
   doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(0,0,0); displayRoles.forEach((r,i)=>{ if(r.pre) doc.text(r.pre,cols[i],y); }); y+=5;
   doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0); displayRoles.forEach((r,i)=>{ doc.text(r.label,cols[i],y); });
   try{ displayRoles.forEach((r,i)=>{ if(r.ttd) doc.addImage(r.ttd,'PNG',cols[i],y+2,34,18); if(r.needCap && r.cap) doc.addImage(r.cap,'PNG',cols[i]+38,y,20,20); }); }catch(e){}
   y+=26; doc.setFont('helvetica','bold'); doc.setFontSize(10); displayRoles.forEach((r,i)=>{ doc.text(r.nama,cols[i],y); }); doc.setFont('helvetica','normal'); doc.setFontSize(8); cols.forEach(c=>{ doc.text("__________________________",c,y+3); }); return y+10;
 } else if(displayRoles.length===4){
   const colL=40, colR=160;
   doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(0,0,0); doc.text(`Kasih, ${tglLong}`,colR,y); y+=4; doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(`Desa Kasih`,colR,y); y+=8;
   let yTop=y; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(0,0,0); if(displayRoles[0].pre) doc.text(displayRoles[0].pre,colL,yTop); if(displayRoles[1].pre) doc.text(displayRoles[1].pre,colR,yTop); yTop+=5; doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0); doc.text(displayRoles[0].label,colL,yTop); doc.text(displayRoles[1].label,colR,yTop);
   try{ if(displayRoles[0].ttd) doc.addImage(displayRoles[0].ttd,'PNG',colL,yTop+2,34,18); if(displayRoles[0].needCap && displayRoles[0].cap) doc.addImage(displayRoles[0].cap,'PNG',colL+38,yTop,20,20); if(displayRoles[1].ttd) doc.addImage(displayRoles[1].ttd,'PNG',colR,yTop+2,34,18); if(displayRoles[1].needCap && displayRoles[1].cap) doc.addImage(displayRoles[1].cap,'PNG',colR+38,yTop,20,20); }catch(e){}
   let yMid=yTop+26; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(displayRoles[0].nama,colL,yMid); doc.text(displayRoles[1].nama,colR,yMid); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",colL,yMid+3); doc.text("__________________________",colR,yMid+3);
   let yBot=yMid+15; doc.setFont('helvetica','italic'); doc.setFontSize(9); doc.setTextColor(0,0,0); if(displayRoles[2].pre) doc.text(displayRoles[2].pre,colL,yBot); if(displayRoles[3].pre) doc.text(displayRoles[3].pre,colR,yBot); yBot+=5; doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(0,0,0); doc.text(displayRoles[2].label,colL,yBot); doc.text(displayRoles[3].label,colR,yBot);
   try{ if(displayRoles[2].ttd) doc.addImage(displayRoles[2].ttd,'PNG',colL,yBot+2,34,18); if(displayRoles[3].ttd) doc.addImage(displayRoles[3].ttd,'PNG',colR,yBot+2,34,18); if(displayRoles[3].needCap && displayRoles[3].cap) doc.addImage(displayRoles[3].cap,'PNG',colR+38,yBot,20,20); }catch(e){}
   let yBot2=yBot+26; doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text(displayRoles[2].nama,colL,yBot2); doc.text(displayRoles[3].nama,colR,yBot2); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.text("__________________________",colL,yBot2+3); doc.text("__________________________",colR,yBot2+3); return yBot2+10;
 }
 return y+10;
}
function exportPDF(){
 const doc=new jsPDF('l','mm','a4');
 const tglFile=new Date().toISOString().slice(0,10);
 doc.setFillColor(15,81,50); doc.rect(0,0,297,28,'F'); doc.setDrawColor(212,175,55); doc.setLineWidth(1.2); doc.line(0,28,297,28);
 doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text("KDKMP KASIH",148.5,12,{align:'center'}); doc.setFontSize(11); doc.text("KOPERASI DESA MERAH PUTIH - DESA KASIH",148.5,19,{align:'center'}); doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.text("KEC. KERTANEGARA - KAB. PURBALINGGA 53354 - JAWA TENGAH",148.5,24,{align:'center'});
 doc.setTextColor(15,81,50); doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.text("LAPORAN KEGIATAN HARIAN MANAJER",10,34); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(80,80,80); doc.text("Dokumen Resmi KDKMP - SIMKOPDES Terintegrasi",10,38);
 const rows=[]; [...baseDays,...getCustomDays()].sort((a,b)=>a.d-b.d).forEach(day=>{ const del=getDeleted(day.d); const add=getAdded(day.d); day.tasks.forEach((orig,i)=>{if(del.includes(i)) return; let text=getText(day.d,i,orig).trim().replace(/\s+/g,' '); const chk=isChecked(day.d,i,false)?'SELESAI':'BELUM'; const status=getStatus(day.d,i,false)||'-'; rows.push([`Hari ${day.d}`,day.t,text,chk,status]);}); add.forEach((t,i)=>{let clean=t.trim().replace(/^[+\-`'"]+/, '').trim().replace(/\s+/g,' '); const chk=isChecked(day.d,i,true)?'SELESAI':'BELUM'; const status=getStatus(day.d,i,true)||'-'; rows.push([`Hari ${day.d}`,day.t,clean,chk,status]);}); });
 doc.autoTable({startY:40, head:[['HARI','JUDUL','KEGIATAN','STATUS','KONDISI']], body:rows, theme:'grid', styles:{font:'helvetica', fontSize:8, cellPadding:2.5, overflow:'linebreak', valign:'middle', lineColor:[180,180,180], lineWidth:0.25}, headStyles:{fillColor:[15,81,50], textColor:255, halign:'center', fontStyle:'bold'}, columnStyles:{0:{cellWidth:15, halign:'center'},1:{cellWidth:32},2:{cellWidth:163},3:{cellWidth:20, halign:'center'},4:{cellWidth:20, halign:'center'}}, didParseCell:function(d){if(d.section==='body'&&d.column.index===3&&d.cell.raw==='SELESAI'){d.cell.styles.fillColor=[220,252,231]; d.cell.styles.textColor=[22,101,52]; d.cell.styles.fontStyle='bold';}}});
 let finalY=doc.lastAutoTable.finalY+4; if(finalY>150){ doc.addPage('l','a4'); finalY=15; } finalY=drawPengesahan(doc, finalY);
 const notes=[]; [...baseDays,...getCustomDays()].sort((a,b)=>a.d-b.d).forEach(day=>{ const active=localStorage.getItem(`noteActive_${day.d}`)==='1'; const text=localStorage.getItem(`note_${day.d}`)||''; if(active && text.trim()) notes.push([`Hari ${day.d}`,day.t,text.trim()]); });
 if(notes.length>0){
   doc.addPage('l','a4'); doc.setFillColor(15,81,50); doc.rect(0,0,297,28,'F'); doc.setDrawColor(212,175,55); doc.setLineWidth(1.2); doc.line(0,28,297,28); doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text("KDKMP KASIH",148.5,12,{align:'center'}); doc.setFontSize(11); doc.text("CATATAN HARIAN AKTIF",148.5,19,{align:'center'}); doc.setFontSize(8); doc.setFont('helvetica','normal'); doc.text("DESA KASIH - KEC. KERTANEGARA",148.5,24,{align:'center'});
   doc.autoTable({startY:34, head:[['HARI','JUDUL','CATATAN']], body:notes, theme:'grid', styles:{font:'helvetica', fontSize:8, cellPadding:2.5, overflow:'linebreak', lineWidth:0.2}, headStyles:{fillColor:[146,64,14], halign:'center'}, columnStyles:{0:{cellWidth:15, halign:'center'},1:{cellWidth:32},2:{cellWidth:203}}});
   let finalY2=doc.lastAutoTable.finalY+4; if(finalY2>150){ doc.addPage('l','a4'); finalY2=15; } drawPengesahan(doc, finalY2);
 }
 doc.save(`KDKMP-KASIH-${tglFile}-WEB-V18-FULL-PDF-FIX.pdf`);
}
