<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 Hari Kerja Pra-Operasional - KDKMP Kasih</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] font-sans">
<div class="bg-[#0f5132] text-white sticky top-0 z-50">
<div class="max-w-5xl mx-auto p-4 flex justify-between items-center">
<div><h1 class="font-bold text-sm">30 HARI PRA-OPERASIONAL</h1><p class="text-[10px] opacity-80">Kasih - 33.03.18.2008 | Mode: Sungkan-Friendly</p></div>
<div class="text-right"><p class="text-[10px]">Progress</p><div class="w-24 h-2 bg-white/20 rounded-full"><div id="progressBar" class="h-2 bg-yellow-300 rounded-full" style="width:0%"></div></div><p id="progressText" class="text-[10px]">0%</p></div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3">
<div class="bg-yellow-50 border border-yellow-200 p-3 rounded-xl mb-4 text-[11px]">
<b>Catatan Manajer:</b> Kamu di fase SK sudah ada, gerai belum jalan. Jangan bolak-balik tiap hari. Kerja cerdas dari rumah, datang 1x/minggu bawa hasil. Ini bikin Kades respect, bukan sungkan.
</div>

<div id="container" class="grid gap-3"></div>

<div class="mt-6 p-4 bg-white rounded-xl border text-center">
<button onclick="exportLaporan()" class="bg-[#0f5132] text-white px-4 py-2 rounded-lg text-xs font-bold">EXPORT LAPORAN 30 HARI UNTUK KADES</button>
<a href="./" class="ml-2 text-xs underline">Kembali ke Dashboard</a>
</div>
</div>

<script>
const days = [
{ d:1, t:"Perkenalan Resmi (Dari Rumah)", m:"RUMAH - WA", tasks:["Kirim WA sopan ke Kades Kasih: perkenalkan diri + lampirkan foto SK + link website kdkmp-kasih.github.io","Save kontak Sekdes, Ketua Kopdes, Kadus","Bikin Folder HP: Dokumen KDKMP Kasih (SK, KTP, Foto)"], out:"Kontak Kades tersave & WA perkenalan terkirim"},
{ d:2, t:"Inventaris Dokumen Digital", m:"RUMAH", tasks:["Foto/scan SK Manajer, AD/ART Kopdes (minta dikirim Kades via WA kalau belum ada)","Catat NIB, Nama Ketua, No HP Pengurus Kopdes","Rapikan file di Google Drive / HP"], out:"File dokumen lengkap di HP"},
{ d:3, t:"Riset Harga Tanpa Keluar Rumah", m:"RUMAH - WA", tasks:["Chat 3 warung di Kasih via WA/tanya tetangga: harga beras, minyak, gula saat ini","Cek harga resmi SPHP di Instagram @idfood.id atau web Bulog","Catat selisih harga pasaran vs harga KDKMP"], out:"Tabel perbandingan harga sederhana"},
{ d:4, t:"Bangun Price List Digital", m:"RUMAH - HP", tasks:["Bikin daftar harga di Canva/Word HP: Beras SPHP 5kg Rp62.500, Minyak Kita, Gula Kita, LPG","Desain poster A4 'Harga Resmi KDKMP Kasih'","Simpan JPG untuk nanti diprint"], out:"Poster harga siap print"},
{ d:5, t:"Jadwal Kunjungan Mingguan", m:"RUMAH", tasks:["Tentukan 1 hari tetap ke desa: misal Jumat jam 10.00-10.30 (jangan tiap hari)","Siapkan buku tamu kecil & alat tulis","Siapkan kalimat pamit: 'Pak, saya izin update progres mingguan 10 menit saja'"], out:"Jadwal 1x/minggu tersusun"},
{ d:6, t:"Hubungi Supplier (Jarak Jauh)", m:"RUMAH - TELP", tasks:["Cari kontak Bulog Purbalingga / ID Food Jateng via Google","Telpon/chat tanya syarat jadi penyalur SPHP (jangan janji dulu, tanya dulu)","Cari kontak agen LPG terdekat Kertanegara"], out:"List kontak supplier + syaratnya"},
{ d:7, t:"Laporan Minggu 1 (WA Kades)", m:"RUMAH - WA", tasks:["Ketik laporan 5 baris: progres dokumen, harga, kontak supplier","Kirim ke Kades via WA + foto poster harga","Minta izin: 'Minggu depan saya izin datang Jumat jam 10 untuk 30 menit'"], out:"Laporan Minggu 1 terkirim"},
{ d:8, t:"KUNJUNGAN #1 - Sopan & Singkat", m:"DESA - 30 MENIT", tasks:["Datang Jumat sesuai janji, pakai baju rapi, bawa buku tamu","Tujuan: minta foto kondisi gerai dari luar saja + tanda tangan buku tamu","Jangan minta kunci, jangan minta anggaran. Pamit: 'Terima kasih, saya lanjutkan dari rumah'"], out:"Foto gerai + buku tamu tanda tangan Kades/Sekdes"},
{ d:9, t:"Evaluasi Kunjungan", m:"RUMAH", tasks:["Tulis catatan: kondisi gerai, apa yang kurang (listrik, rak, dll)","Upload foto gerai ke website (minta tolong edit index.html nanti)","Istirahat, jangan balik lagi minggu ini"], out:"Catatan kondisi gerai"},
{ d:10, t:"Belajar SOP Agrinas", m:"RUMAH", tasks:["Baca ulang PDF sosialisasi KDKMP (cari di grup WA Kabupaten)","Catat 3 kewajiban Manajer pra-operasional","Tanya di grup Manajer Purbalingga: pengalaman fase pra-buka"], out:"Rangkuman SOP 1 halaman"},
{ d:11, t:"Bikin SOP Kasir Sederhana", m:"RUMAH", tasks:["Bikin di Excel/Notes HP: format nota, stok masuk-keluar, tutup kas","Bikin format WA untuk lapor harian ke Kades (template)","Simpan template"], out:"Template nota & laporan harian"},
{ d:12, t:"Riset Kompetitor Desa", m:"RUMAH - WA", tasks:["Tanya via WA ke warga: belanja paling sering dimana? Kenapa?","Catat jam buka warung paling ramai di Kasih","Cari celah: produk apa yang belum ada di Kasih"], out:"Insight kebutuhan warga"},
{ d:13, t:"Desain Tata Letak Gerai (Di Kertas)", m:"RUMAH", tasks:["Gambar denah gerai di kertas: rak beras dimana, LPG dimana, kasir dimana","Foto gambar, simpan","Siapkan list kebutuhan rak minimal (2 rak besi)"], out:"Sketsa denah gerai"},
{ d:14, t:"Laporan Minggu 2", m:"RUMAH - WA", tasks:["Kirim laporan: foto kunjungan + denah + template kasir","WA Kades: 'Ini usulan penataan gerai, mohon arahan'","Minta jadwal lagi: izin datang Minggu depan Jumat"], out:"Laporan Minggu 2 terkirim"},
{ d:15, t:"KUNJUNGAN #2 - Bawa Solusi", m:"DESA - 40 MENIT", tasks:["Datang bawa print poster harga + sketsa denah (biaya <20rb)","Tujuan: minta pendapat Kades, bukan minta dana","Foto bareng poster (untuk dokumentasi laporan Agrinas)"], out:"Persetujuan konsep penataan"},
{ d:16, t:"Follow Up Supplier", m:"RUMAH", tasks:["Follow up WA ke Bulog/ID Food yang minggu lalu","Tanya MOQ (minimal order) Beras SPHP untuk awal","Hitung modal awal simulasi (jangan pakai uang pribadi dulu)"], out:"RAB awal simulasi"},
{ d:17, t:"Bangun Grup WA Pelanggan", m:"RUMAH", tasks:["Bikin Grup WA: 'Info Harga KDKMP Kasih'","Undang 10 warga terdekat dulu (ibu-ibu PKK)","Posting poster harga + link website"], out:"Grup WA 10 anggota"},
{ d:18, t:"Konten Edukasi", m:"RUMAH - HP", tasks:["Bikin 1 konten HP: video 15 detik 'Beras SPHP Rp12.500/kg akan hadir di Kasih'","Posting di Status WA & Grup","Jangan janji tanggal buka, tulis 'Segera Hadir'"], out:"1 konten promo"},
{ d:19, t:"Simulasi Keuangan", m:"RUMAH", tasks:["Hitung di kalkulator: jika jual 20 karung SPHP margin Rp500/kg =?","Hitung biaya transport & plastik","Catat target BEP awal"], out:"Hitungan laba sederhana"},
{ d:20, t:"Persiapan Administrasi Buka", m:"RUMAH", tasks:["Siapkan: buku stok, buku kas, pulpen, kalkulator, plastik","List di HP: apa yang sudah ada di gerai vs belum","Siapkan surat permohonan kecil (jika butuh listrik tambahan)"], out:"Checklist pembukaan"},
{ d:21, t:"Laporan Minggu 3", m:"RUMAH - WA", tasks:["Kirim laporan lengkap: RAB, grup WA, konten, checklist","Minta Kades: 'Apakah bisa dibahas di rapat mingguan desa?'","Jangan datang dulu minggu ini, biar Kades yang undang"], out:"Laporan Minggu 3 terkirim"},
{ d:22, t:"Menunggu Undangan Desa", m:"RUMAH - STANDBY", tasks:["Standby, rapikan laporan","Jawab chat warga di grup harga dengan ramah","Update website index.html dengan foto baru (jika ada)"], out:"Responsif di WA"},
{ d:23, t:"KUNJUNGAN #3 - Rapat Koordinasi", m:"DESA - 60 MENIT", tasks:["Datang jika diundang rapat, bawa semua laporan print","Presentasi 5 menit: progres 3 minggu tanpa beban desa","Minta keputusan: tanggal target soft opening + dukungan listrik/rak"], out:"Berita Acara kecil / kesepakatan lisan"},
{ d:24, t:"Final Checklist Pra-Buka", m:"RUMAH", tasks:["Berdasarkan rapat, bikin checklist final apa yang harus disiapkan desa","Bikin timeline 7 hari menuju buka","Share checklist ke Kades via WA"], out:"Timeline H-7"},
{ d:25, t:"Gladi Resik Sistem", m:"RUMAH", tasks:["Simulasi jualan di rumah: timbang beras, catat nota, hitung kembalian","Latihan tutup kas harian 10 menit","Siapkan seragam/kemeja rapi untuk hari H"], out:"Sistem kasir lancar"},
{ d:26, t:"Promo H-3", m:"RUMAH - WA", tasks:["Posting di Grup: 'H-3 KDKMP Kasih Buka, Harga SPHP Rp12.500'","Chat 1 per 1 20 warga: 'Mohon doanya bu, mau buka'","Siapkan daftar antrian awal (jika perlu)"], out:"Antusiasme warga"},
{ d:27, t:"H-1 Persiapan", m:"DESA - 60 MENIT", tasks:["Datang pasang poster harga di gerai (jika diizinkan)","Bersihkan rak, tata sedikit","Foto final gerai siap buka"], out:"Gerai siap 80%"},
{ d:28, t:"SOFT OPENING", m:"DESA", tasks:["Buka 3 jam saja (08.00-11.00), jual terbatas (SPHP saja)","Fokus: pelayanan ramah, catat semua transaksi","Foto dokumentasi untuk laporan Agrinas"], out:"Transaksi hari pertama"},
{ d:29, t:"Evaluasi Hari Pertama", m:"RUMAH", tasks:["Hitung laba rugi hari 1","Catat komplain warga & stok kurang","Kirim laporan singkat ke Kades: 'Alhamdulillah buka, terima kasih dukungannya'"], out:"Laporan evaluasi"},
{ d:30, t:"Laporan 30 Hari & Rencana Bulan 2", m:"RUMAH", tasks:["Klik EXPORT LAPORAN di website ini","Kirim PDF/TXT ke Kades, Korwil Kertanegara, Dinkop Purbalingga","Tulis rencana bulan 2: target tambah produk LPG & Minyak Kita"], out:"Laporan 30 Hari Lengkap - TUNTAS PRA-OPERASIONAL"}
];

const container = document.getElementById('container');
days.forEach(day => {
  const div = document.createElement('div');
  div.className = 'bg-white p-3 rounded-xl border border-slate-200';
  div.innerHTML = `
    <div class="flex justify-between items-start">
      <div class="flex gap-2">
        <input type="checkbox" id="d${day.d}" onchange="updateProgress()" class="mt-1 w-4 h-4">
        <div>
          <p class="font-bold text-[12px]">HARI ${day.d}: ${day.t}</p>
          <span class="inline-block mt-1 text-[9px] px-2 py-0.5 rounded-full ${day.m.includes('RUMAH')? 'bg-blue-100 text-blue-700' : 'bg-orange-100 text-orange-700'}">${day.m}</span>
          <ul class="mt-2 list-disc ml-4 text-[11px] text-slate-600 space-y-0.5">${day.tasks.map(t=>`<li>${t}</li>`).join('')}</ul>
          <p class="mt-2 text-[10px]"><b>Output:</b> ${day.out}</p>
        </div>
      </div>
    </div>
    <textarea id="note${day.d}" placeholder="Tulis catatan/output hari ${day.d} disini..." class="mt-2 w-full border rounded p-2 text-[11px] h-14"></textarea>
  `;
  container.appendChild(div);
  const savedCheck = localStorage.getItem('kdkmp_kasih_check_'+day.d);
  const savedNote = localStorage.getItem('kdkmp_kasih_note_'+day.d);
  if(savedCheck==='1') div.querySelector('input').checked=true;
  if(savedNote) div.querySelector('textarea').value=savedNote;
  div.querySelector('textarea').addEventListener('input', (e)=>{ localStorage.setItem('kdkmp_kasih_note_'+day.d, e.target.value); });
});

function updateProgress(){
  let done=0;
  days.forEach(day=>{
    const cb=document.getElementById('d'+day.d);
    if(cb.checked){ done++; localStorage.setItem('kdkmp_kasih_check_'+day.d,'1'); }
    else localStorage.setItem('kdkmp_kasih_check_'+day.d,'0');
  });
  const pct=Math.round(done/30*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressText').innerText=pct+'% ('+done+'/30)';
}
updateProgress();

function exportLaporan(){
  let txt=`LAPORAN 30 HARI PRA-OPERASIONAL - KDKMP DESA KASIH\nID: 33.03.18.2008 - Kertanegara - Purbalingga\nWebsite: https://kdkmp-kasih.github.io/kdkmp-kasih/\nTanggal Export: ${new Date().toLocaleString('id-ID')}\n\n`;
  days.forEach(day=>{
    const cb=document.getElementById('d'+day.d);
    const note=document.getElementById('note'+day.d).value||'-';
    txt+=`HARI ${day.d} [${cb.checked?'SELESAI':'BELUM'}] - ${day.t} (${day.m})\nOutput: ${day.out}\nCatatan: ${note}\n\n`;
  });
  const blob=new Blob([txt],{type:'text/plain'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Laporan-30Hari-KDKMP-Kasih.txt'; a.click();
}
</script>
</body>
</html>
