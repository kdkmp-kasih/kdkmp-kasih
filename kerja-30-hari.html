<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lembar Kerja 30 Hari - Manajer KDKMP Kasih</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.done{background:#dcfce7}</style>
</head>
<body class="bg-[#f6f7f4]">
<header class="bg-green-700 text-white p-4 sticky top-0 z-50">
<div class="max-w-4xl mx-auto">
<h1 class="font-bold text-sm">LEMBAR KERJA 30 HARI - MANAJER KDKMP DESA KASIH</h1>
<p class="text-[10px] opacity-80">Kertanegara - Purbalingga | 33.03.18.2008 | Status: Sudah Ditempatkan, Menunggu SK Kerja | yakuygamer-cmyk.github.io/kdkmp-kasih</p>
<div class="mt-2 bg-white/20 rounded-full h-2"><div id="progressBar" class="bg-yellow-300 h-2 rounded-full" style="width:0%"></div></div>
<p class="text-[10px] mt-1"><span id="progressText">0%</span> selesai - <span id="countDone">0</span>/30 hari</p>
</div>
</header>

<div class="max-w-4xl mx-auto p-3 space-y-3" id="container"></div>

<div class="max-w-4xl mx-auto p-3">
<button onclick="exportLaporan()" class="w-full bg-green-700 text-white rounded-xl py-3 font-bold text-xs">📄 EXPORT LAPORAN 30 HARI UNTUK KADES & DINKOP</button>
</div>

<script>
const rencana=[
{hari:1,judul:"Legalitas Awal",tugas:["Foto papan nama / lokasi gerai KDKMP Kasih","Minta salinan SK Kepala Desa tentang KDKMP","Catat luas gerai (PxL) & foto kondisi"],output:"Foto & SK terkumpul"},
{hari:2,judul:"Data Penduduk",tugas:["Temui Sekdes minta data DTSE 3.500 jiwa","Hitung Desil 1-3 (target beras SPHP)","Input ke dashboard github yang sudah jadi"],output:"Desil 1-3 =... KK"},
{hari:3,judul:"Pemetaan Kontak - Desa",tugas:["Kades, Sekdes, Bidan Desa, Ketua Gapoktan, Babinsa","Catat No HP di tab Kontak dashboard","Buat WA Group 'KDKMP Kasih - Inti'"],output:"5 kontak inti terdata"},
{hari:4,judul:"Pemetaan Kontak - Pasokan",tugas:["Bulog Banyumas (Beras SPHP Rp12.500)","Agen LPG 3kg Kertanegara","ID Food Minyakita Rp15.700","Toko Pupuk Purbalingga"],output:"Daftar harga HET terkumpul"},
{hari:5,judul:"Audit Aset Gerai",tugas:["Cek listrik, timbangan, etalase, gudang","List kebutuhan perbaikan (cat, kunci, rak)","Estimasi biaya perbaikan awal"],output:"RAB perbaikan gerai"},
{hari:6,judul:"Potensi Lokal Kasih",tugas:["Data padi: luas sawah, gabah, penggilingan terdekat","Data kelapa: penderes, produksi gula","Data UMKM: keripik, anyaman, dll (min 3)"],output:"3 potensi unggulan terdata"},
{hari:7,judul:"Laporan Mingguan 1",tugas:["Rekap hari 1-6 ke format laporan","Kirim ke Kades + Korwil Agrinas","Minta feedback"],output:"Laporan Minggu 1 terkirim"},
{hari:8,judul:"Simulasi Keuangan",tugas:["Hitung modal awal subsidi (Beras 500kg x Rp12.500)","Hitung omzet harian target (contoh Rp500rb)","Buat tabel rugi laba sederhana di buku"],output:"Simulasi modal selesai"},
{hari:9,judul:"SOP Gerai",tugas:["Jam buka: 08.00-16.00","Harga HET ditempel besar di dinding","Buku tamu & buku stok harian disiapkan"],output:"SOP tertulis & ditempel"},
{hari:10,judul:"Rekrut Calon Karyawan",tugas:["Tanya Bidan Desa: Desil 1-2 yang butuh kerja","Cari 2 calon: 1 admin, 1 gudang","Catat NIK & latar belakang"],output:"2 calon karyawan terdata"},
{hari:11,judul:"Jalur Distribusi",tugas:["Cek jalan masuk truk Bulog ke gerai","Cek biaya angkut dari Bulog Banyumas ke Kasih","Alternatif pickup desa"],output:"Jalur logistik jelas"},
{hari:12,judul:"Branding Gerai",tugas:["Print QR Dashboard (link github kamu)","Print daftar harga HET","Pasang spanduk 'KDKMP Desa Kasih - Harga Pemerintah'"],output:"Gerai siap foto untuk laporan"},
{hari:13,judul:"Uji Coba Sistem",tugas:["Input stok dummy di dashboard github","Coba scan QR oleh warga","Coba WA ke kontak Bulog"],output:"Sistem github berjalan"},
{hari:14,judul:"Laporan Mingguan 2",tugas:["Rekap hari 8-13","Foto progress gerai before-after","Kirim ke Dinkop Purbalingga"],output:"Laporan Minggu 2 terkirim"},
{hari:15,judul:"Perizinan NIB & Simkopdes",tugas:["Tanya Dinkop: status NIB KDKMP Kasih","Cek login Simkopdes Kopdes Merah Putih","Kumpulkan KTP Pengurus untuk upload"],output:"NIB & akses Simkopdes dicek"},
{hari:16,judul:"Stok Perdana - Negosiasi",tugas:["Hub Bulog: minta jadwal drop beras SPHP","Hub Agen LPG: minta kuota awal 50 tab","Hub ID Food: stok Minyakita awal"],output:"Jadwal drop perdana didapat"},
{hari:17,judul:"Sosialisasi RT/RW",tugas:["Temui Ketua RT 1-5 Desa Kasih","Jelaskan harga beras SPHP Rp12.500 untuk Desil 1-3","Bagikan brosur / WA broadcast"],output:"5 RT tersosialisasi"},
{hari:18,judul:"Koperasi & Anggota",tugas:["Data anggota KDKMP Kasih (target 20 orang)","Buat list simpanan pokok","Jelaskan SHU ke warga"],output:"20 calon anggota terdata"},
{hari:19,judul:"Keuangan & Kas",tugas:["Buka rekening atas nama KDKMP Kasih (BRI/BNI)","Buat pembukuan kas harian (buku tulis)","Pisahkan kas subsidi & kas UMKM"],output:"Rekening & buku kas siap"},
{hari:20,judul:"Gladi Resik",tugas:["Simulasi 1 hari jualan (tanpa pembeli)","Catat waktu layanan per orang","Perbaiki alur antrian"],output:"Gladi resik selesai"},
{hari:21,judul:"Laporan Mingguan 3",tugas:["Video 1 menit tur gerai Kasih","Rekap semua data hari 15-20","Siapkan untuk presentasi Kades"],output:"Laporan Minggu 3 + Video"},
{hari:22,judul:"Soft Opening",tugas:["Jual perdana 10 karung beras SPHP (jika stok ada)","Atau jual produk UMKM lokal dulu","Catat semua transaksi di dashboard"],output:"Transaksi pertama tercatat"},
{hari:23,judul:"Evaluasi Harga",tugas:["Bandingkan harga pasar Kertanegara vs HET gerai","Catat selisih keuntungan warga","Buat testimoni 2 warga pembeli"],output:"Testimoni warga terkumpul"},
{hari:24,judul:"Digitalisasi",tugas:["Update Google Sheet (jika sudah buat)","Share link dashboard ke grup WA Desa","Minta warga isi rating pelayanan"],output:"Link dashboard disebar"},
{hari:25,judul:"Rencana Bulan 2",tugas:["Target omzet bulan 2","Rencana tambah komoditas (telur, gula, dll)","Rencana jemput bola ke dusun terjauh"],output:"Rencana Bulan 2 tertulis"},
{hari:26,judul:"Administrasi Lengkap",tugas:["Foto semua bukti: Nota Bulog, Buku kas, Foto gerai","Scan KTP pengurus","Backup data github ke PDF"],output:"Arsip digital lengkap"},
{hari:27,judul:"Presentasi Kades",tugas:["Buat 5 slide: Profil, Stok, Keuangan, Potensi, Rencana","Presentasi ke Kades Kasih 15 menit","Minta tanda tangan pengesahan"],output:"Presentasi selesai & ditandatangani"},
{hari:28,judul:"Laporan ke Korwil Agrinas",tugas:["Kirim Laporan 30 hari via WA + Email","Lampirkan link github & google sheet","Minta arahan resmi mulai kerja"],output:"Laporan resmi terkirim"},
{hari:29,judul:"Perbaikan Akhir",tugas:["Perbaiki yang diminta Kades/Korwil","Bersihkan gerai total","Siapkan seragam / ID Card sederhana"],output:"Gerai 100% siap operasional"},
{hari:30,judul:"GRAND LAUNCHING SIAP",tugas:["Doa bersama perangkat desa","Buka gerai resmi hari pertama","Dokumentasi foto & video untuk Dinkop"],output:"KDKMP DESA KASIH RESMI BEROPERASI"},
];

function render(){
 const cont=document.getElementById('container');
 const saved=JSON.parse(localStorage.getItem('kerja30-kasih')||'{}');
 let done=0;
 cont.innerHTML='';
 rencana.forEach(r=>{
   const id='h'+r.hari;
   const data=saved[id]||{check:[false,false,false],catatan:'',selesai:false};
   if(data.selesai) done++;
   const checks=r.tugas.map((t,i)=>`
     <label class="flex gap-2 items-start text-[11px] py-1 ${data.check[i]?'line-through text-gray-400':''}">
       <input type="checkbox" ${data.check[i]?'checked':''} onchange="toggleCheck(${r.hari},${i})" class="mt-1">
       <span>${t}</span>
     </label>
   `).join('');
   cont.innerHTML+=`
   <div class="bg-white rounded-xl border p-3 ${data.selesai?'done':''}">
     <div class="flex justify-between items-center">
       <div><p class="text-[9px] text-green-700 font-bold">HARI ${r.hari}</p><h2 class="font-bold text-xs">${r.judul}</h2><p class="text-[9px] text-gray-500">Output: ${r.output}</p></div>
       <label class="flex items-center gap-1 text-[10px] font-bold"><input type="checkbox" ${data.selesai?'checked':''} onchange="toggleSelesai(${r.hari})"> SELESAI</label>
     </div>
     <div class="mt-2 border-t pt-2">${checks}</div>
     <textarea id="cat-${r.hari}" placeholder="Catatan hari ini... (misal: ketemu Bu Bidan, Desil 1 ada 110 KK, no HP 08...)" class="w-full border rounded-lg p-2 text-[11px] mt-2" rows="2" oninput="saveCat(${r.hari})">${data.catatan||''}</textarea>
     <p class="text-[8px] text-gray-400 mt-1">Auto-save di HP kamu</p>
   </div>`;
 });
 document.getElementById('progressBar').style.width=(done/30*100)+'%';
 document.getElementById('progressText').innerText=Math.round(done/30*100)+'%';
 document.getElementById('countDone').innerText=done;
}
function toggleCheck(h,i){let s=JSON.parse(localStorage.getItem('kerja30-kasih')||'{}');if(!s['h'+h])s['h'+h]={check:[false,false,false],catatan:'',selesai:false};s['h'+h].check[i]=!s['h'+h].check[i];localStorage.setItem('kerja30-kasih',JSON.stringify(s));render();}
function toggleSelesai(h){let s=JSON.parse(localStorage.getItem('kerja30-kasih')||'{}');if(!s['h'+h])s['h'+h]={check:[false,false,false],catatan:'',selesai:false};s['h'+h].selesai=!s['h'+h].selesai;localStorage.setItem('kerja30-kasih',JSON.stringify(s));render();}
function saveCat(h){let s=JSON.parse(localStorage.getItem('kerja30-kasih')||'{}');if(!s['h'+h])s['h'+h]={check:[false,false,false],catatan:'',selesai:false};s['h'+h].catatan=document.getElementById('cat-'+h).value;localStorage.setItem('kerja30-kasih',JSON.stringify(s));}
function exportLaporan(){let s=JSON.parse(localStorage.getItem('kerja30-kasih')||'{}');let txt=`LAPORAN 30 HARI MANAJER KDKMP DESA KASIH - KERTANEGARA\nTanggal Export: ${new Date().toLocaleDateString('id-ID')}\nLink Dashboard: https://yakuygamer-cmyk.github.io/kdkmp-kasih/\n\n`;rencana.forEach(r=>{let d=s['h'+r.hari];txt+=`HARI ${r.hari} - ${r.judul} : ${d&&d.selesai?'SELESAI':'BELUM'}\nCatatan: ${d?d.catatan:'-'}\n\n`;});let blob=new Blob([txt],{type:'text/plain'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Laporan-30Hari-Kasih-${Date.now()}.txt`;a.click();}
render();
</script>
</body>
</html>
