<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V8.1 - Set Tanggal Start - KDKMP Kasih</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc]">
<div class="bg-[#0f5132] text-white sticky top-0 z-50 shadow">
<div class="max-w-5xl mx-auto p-3 flex justify-between items-center gap-2">
<div class="flex-1"><h1 class="font-bold text-[12px]">RENCANA KERJA 30 HARI + PROGRES</h1><p class="text-[9px] opacity-80">KDKMP Desa Kasih - V8.1 Progresif</p>
<div class="flex items-center gap-2 mt-1">
<label class="text-[9px]">Set Hari-1:</label>
<input type="date" id="startInput" class="text-[10px] text-black rounded px-1.5 py-0.5" onchange="setStartDate(this.value)">
<button onclick="resetStart()" class="text-[9px] bg-white/20 px-2 py-0.5 rounded">Reset Hari Ini</button>
</div>
<p id="tgl" class="text-[10px] font-bold text-yellow-200 mt-1"></p></div>
<div class="text-right"><div class="w-32 h-2 bg-white/20 rounded-full"><div id="bar" class="h-2 bg-yellow-300 rounded-full transition-all" style="width:0%"></div></div><p id="txt" class="text-[10px] font-bold">0%</p><p id="statusHari" class="text-[9px] mt-1"></p></div>
</div>
</div>

<div class="max-w-5xl mx-auto p-3 space-y-3">
<div id="rekap" class="bg-white border-2 border-[#0f5132] p-3 rounded-xl"></div>
<div id="alertLembur" class="hidden bg-amber-50 border border-amber-300 p-3 rounded-xl">
<p class="text-[11px] font-bold text-amber-800">⚠️ Lembur - Dikerjakan lebih awal:</p>
<div id="listLembur" class="text-[10px] text-amber-700 mt-1"></div>
</div>
<div id="container" class="grid gap-3"></div>
<div class="p-4 bg-white rounded-xl border text-center">
<button onclick="exportLaporan()" class="bg-[#0f5132] text-white px-5 py-2.5 rounded-lg text-xs font-bold w-full">EXPORT LAPORAN + PROGRES HARIAN</button>
</div>
</div>

<script>
function getStoredStart(){return localStorage.getItem('kdkmp_startDate');}
function setStartDate(val){if(!val) return; localStorage.setItem('kdkmp_startDate',val); render();}
function resetStart(){localStorage.removeItem('kdkmp_startDate'); document.getElementById('startInput').value=''; render();}
function getStartDateObj(){
  const stored=getStoredStart();
  if(stored){const d=new Date(stored); d.setHours(0,0,0,0); return d;}
  const now=new Date(); now.setHours(0,0,0,0); return now;
}
function getHariIni(){
  const start=getStartDateObj();
  const now=new Date(); now.setHours(0,0,0,0);
  const diff=Math.floor((now-start)/86400000)+1;
  return diff<1?1:diff;
}

const days=[
{d:1,t:"Laporan Diri & Silaturahmi",tasks:["Lapor keberadaan & serah terima ke Kades/Lurah & Pengurus KDKMP","Silaturahmi pimpinan BPD","Mendata kontak tokoh masyarakat RT/RW"]},
{d:2,t:"Visi Kepemimpinan",tasks:["Silaturahmi tokoh masyarakat RT/RW","Sampaikan visi inklusif, kolaboratif, transparan","Catat aspirasi awal"]},
{d:3,t:"Inventarisasi Aset Fisik",tasks:["Catat aset fisik (kantor, mesin, peralatan)","Catat stok usaha","Foto aset untuk BAST"]},
{d:4,t:"Audit Administrasi & SIMKOPDES",tasks:["Periksa dokumen legalitas","Periksa rekening bank & arsip keuangan","Test login SIMKOPDES"]},
{d:5,t:"Pemetaan Anggota",tasks:["Kumpulkan data anggota aktif/pasif/calon","Rekap untuk input SIMKOPDES"]},
{d:6,t:"Pemetaan Ekonomi & Desil",tasks:["Tinjau data Desil wilayah","Petakan potensi ekonomi desa"]},
{d:7,t:"BAST Minggu 1",tasks:["Susun BAST Aset & Dokumen","Susun Pemetaan Awal","Kirim laporan Minggu 1 ke Kades"]},
{d:8,t:"SIMKOPDES Keanggotaan",tasks:["Input/update anggota & profil KDKMP ke SIMKOPDES","Verifikasi NIK"]},
{d:9,t:"SIMKOPDES Keuangan",tasks:["Tata alur pembukuan selaras SIMKOPDES","Input saldo awal kas & bank"]},
{d:10,t:"Integrasi Privy",tasks:["Pastikan alur ttd dokumen terintegrasi Privy","Uji coba ttd elektronik"]},
{d:11,t:"SOP Kas & Keuangan",tasks:["Susun SOP Kas & Keuangan","Susun SOP pelaporan harian"]},
{d:12,t:"SOP Pelayanan & Stok",tasks:["Susun SOP Pelayanan Anggota","Susun SOP Pengelolaan Stok/Barang"]},
{d:13,t:"Persiapan Rapat Konsolidasi",tasks:["Siapkan materi pemetaan & draf SOP","Buat undangan Pengurus & Pengawas"]},
{d:14,t:"Rapat Konsolidasi",tasks:["Presentasi pemetaan & SOP ke Pengurus & Pengawas","Sepakati Q1 Targets","Deliverable: SIMKOPDES & Buku SOP"]},
{d:15,t:"Quick Win Persiapan",tasks:["Tentukan Quick Win: Sembako/Pupuk/PPOB","Siapkan stok awal & harga","Koordinasi Agrinas 1 pintu"]},
{d:16,t:"Quick Win Operasional",tasks:["Layanan prioritas Quick Win","Penyediaan kebutuhan pokok/pupuk"]},
{d:17,t:"Pencatatan Real-time",tasks:["Pencatatan transaksi Quick Win real-time di SIMKOPDES","Cek stok & cash"]},
{d:18,t:"Sosialisasi Forum Desa",tasks:["Sosialisasi di rembug warga/pengajian/RWT","Jelaskan hak/kewajiban & SHU"]},
{d:19,t:"Posko Pendaftaran",tasks:["Buka posko pendaftaran anggota baru","Bagi brosur literasi keuangan"]},
{d:20,t:"Literasi & Rekrutmen",tasks:["Edukasi transparansi SHU","Kumpulkan 10 calon anggota baru"]},
{d:21,t:"Deliverable Minggu 3",tasks:["Evaluasi layanan Quick Win","Rekap anggota baru","Laporan Minggu 3"]},
{d:22,t:"Reconcile",tasks:["Reconcile kas/bank/SIMKOPDES","Verifikasi transaksi Minggu 1-3"]},
{d:23,t:"Laporan Keuangan",tasks:["Susun Laba/Rugi, Neraca Kas","Susun Laporan Perkembangan Anggota"]},
{d:24,t:"Analisis Quick Win",tasks:["Analisis omzet & margin","Analisis animo warga"]},
{d:25,t:"Persiapan Laporan Eksternal",tasks:["Siapkan Laporan Kinerja Bulanan untuk Dinkop/Kementerian"]},
{d:26,t:"Pelaporan Eksternal",tasks:["Kirim Laporan ke pembina","Diskusi dengan Pendamping Lapangan"]},
{d:27,t:"Koordinasi Pendamping",tasks:["Koordinasi Pendamping wilayah","Minta arahan Bulan 2"]},
{d:28,t:"Persiapan Evaluasi",tasks:["Susun materi evaluasi 30 hari","Draf Rencana Bulan 2"]},
{d:29,t:"Rapat Evaluasi",tasks:["Rapat evaluasi bersama Pengurus","Catat masukan & kendala"]},
{d:30,t:"Master Plan Bulan 2",tasks:["Susun Rencana Bulan 2","Finalisasi Laporan Resmi & Master Plan","Export & kirim ke Kades/Korwil/Dinas"]},
];

const container=document.getElementById('container');
function render(){
 const stored=getStoredStart();
 if(stored) document.getElementById('startInput').value=stored;
 const startObj=getStartDateObj();
 const hariIni=getHariIni();
 const tglStr=startObj.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
 document.getElementById('tgl').innerText=`Start Hari-1: ${tglStr} | Hari ini: Hari ke-${hariIni} - ${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'})}`;

 container.innerHTML=''; let total=0,done=0; let lembur=[]; let sudahHariIni=[]; let belumHariIni=[];
 days.forEach(day=>{
   let html=day.tasks.map((t,i)=>{
     const key=`v81_${day.d}_${i}`; const chk=localStorage.getItem(key)==='1';
     if(chk){done++; if(day.d===hariIni) sudahHariIni.push(t); if(day.d>hariIni) lembur.push(`Hari ${day.d}: ${t}`);}
     else { if(day.d<=hariIni) belumHariIni.push(`Hari ${day.d}: ${t}`);}
     total++;
     return `<label class="flex gap-2 items-start py-1.5 px-2 rounded hover:bg-slate-50 cursor-pointer border-b last:border-0 ${day.d>hariIni && chk?'bg-amber-50':''}"><input type="checkbox" data-key="${key}" data-day="${day.d}" ${chk?'checked':''} class="mt-0.5 w-4 h-4 accent-[#0f5132]"><span class="text-[11px] leading-snug ${chk?'line-through text-slate-400':''}">${t} ${day.d>hariIni && chk?'<b class=text-amber-600> ⚠️ LEMBUR</b>':''}</span></label>`;
   }).join('');
   const sisa=day.tasks.length - day.tasks.filter((_,i)=>localStorage.getItem(`v81_${day.d}_${i}`)==='1').length;
   const isToday=day.d===hariIni;
   const isPast=day.d<hariIni;
   const isFuture=day.d>hariIni;
   const div=document.createElement('div');
   div.className=`bg-white p-3 rounded-xl border shadow-sm ${isToday?'ring-2 ring-[#0f5132]':''} ${isPast && sisa>0?'border-red-200':''}`;
   div.innerHTML=`<div class="flex justify-between items-center"><p class="font-bold text-[12px] ${isToday?'text-[#0f5132]':''}">${isToday?'👉 ':isPast?'':isFuture?'🔜 ':''}HARI ${day.d}: ${day.t} ${isToday?'(HARI INI)':isPast && sisa>0?'(TERTUNDA)':isFuture?'(MENDATANG)':''}</p><span class="text-[9px] px-2 py-0.5 rounded-full font-bold ${sisa===0?'bg-green-100 text-green-700':isPast?'bg-red-100 text-red-700':'bg-slate-100 text-slate-600'}">${sisa===0?'Selesai':'Sisa '+sisa}</span></div><div class="mt-2 bg-slate-50 rounded border">${html}</div><textarea id="note${day.d}" placeholder="Progres hari ${day.d} - udah ngapain aja..." class="mt-2 w-full border rounded p-2 text-[11px] h-12 bg-white">${localStorage.getItem('noteV81_'+day.d)||''}</textarea>`;
   container.appendChild(div);
 });
 const persen=total?Math.round(done/total*100):0;
 document.getElementById('bar').style.width=persen+'%';
 document.getElementById('txt').innerText=persen+'% ('+done+'/'+total+')';
 document.getElementById('statusHari').innerText=hariIni<=30?`Hari ke-${hariIni} dari 30`:'Selesai 30 hari';

 document.getElementById('rekap').innerHTML=`
 <div class="flex justify-between"><p class="font-bold text-[12px]">📊 PROGRES HARIAN - Hari ke-${hariIni}</p><p class="text-[9px] bg-slate-100 px-2 py-1 rounded">Start: ${tglStr}</p></div>
 <div class="grid grid-cols-2 gap-3 mt-2">
 <div class="bg-green-50 border border-green-200 p-2 rounded-lg"><p class="text-[10px] font-bold text-green-800">✅ SUDAH DIKERJAKAN HARI INI (Hari ${hariIni}):</p><p class="text-[10px] text-green-700 mt-1">${sudahHariIni.length?sudahHariIni.map(s=>`• ${s}`).join('<br>'):'Belum ada - centang di bawah'}</p></div>
 <div class="bg-red-50 border border-red-200 p-2 rounded-lg"><p class="text-[10px] font-bold text-red-800">⏳ BELUM / TERTUNDA (s.d. Hari ${hariIni}):</p><p class="text-[10px] text-red-700 mt-1">${belumHariIni.slice(0,6).map(s=>`• ${s}`).join('<br>')}${belumHariIni.length>6?`<br>+${belumHariIni.length-6} lagi`:''}${belumHariIni.length===0?'Semua beres hari ini!':''}</p></div>
 </div>
 `;

 if(lembur.length>0){
   document.getElementById('alertLembur').classList.remove('hidden');
   document.getElementById('listLembur').innerHTML=lembur.map(l=>`• ${l} <span class=text-amber-600> (dikerjakan lebih awal)</span>`).join('<br>');
 } else {
   document.getElementById('alertLembur').classList.add('hidden');
 }

 container.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.addEventListener('change',e=>{
   localStorage.setItem(e.target.dataset.key,e.target.checked?'1':'0');
   render();
 }));
 container.querySelectorAll('textarea').forEach(ta=>ta.addEventListener('input',e=>{localStorage.setItem('noteV81_'+e.target.id.replace('note',''),e.target.value);}));
}
render();
function exportLaporan(){
 let txt=`LAPORAN 30 HARI + PROGRES - KDKMP KASIH\nStart Hari-1: ${getStartDateObj().toLocaleDateString('id-ID')}\nExport Hari ke-${getHariIni()} - ${new Date().toLocaleString('id-ID')}\n\n`;
 days.forEach(day=>{
   txt+=`\nHARI ${day.d} - ${day.t} ${day.d===getHariIni()?'(HARI INI)':''}\n`;
   day.tasks.forEach((t,i)=>{const isLembur=parseInt(day.d)>getHariIni() && localStorage.getItem(`v81_${day.d}_${i}`)==='1'; txt+=` ${localStorage.getItem(`v81_${day.d}_${i}`)==='1'?'[✓]':'[ ]'} ${t}${isLembur?' (LEMBUR - DIKERJAKAN LEBIH AWAL)':''}\n`;});
   txt+=` Progres: ${localStorage.getItem('noteV81_'+day.d)||'-'}\n`;
 });
 const blob=new Blob([txt],{type:'text/plain'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`Laporan-Hari${getHariIni()}-KDKMP-Kasih.txt`; a.click();
}
</script>
</body>
</html>
