<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info KDKMP Desa Kasih</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#f6f7f6;margin:0;padding:16px}
.header{background:#0f4d2e;color:white;padding:16px;border-radius:16px;margin-bottom:16px}
.header h1{margin:0;font-size:20px}
.header p{margin:4px 0 0 0;opacity:.8;font-size:13px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;margin-right:6px}
.harga{background:#d1fae5} .stok{background:#dbeafe}
.qr-box{background:white;border-radius:16px;padding:20px;text-align:center;margin-top:24px}
#qrcode{display:flex;justify-content:center;margin:12px 0}
</style>
</head>
<body>

<div class="header">
<h1>KDKMP DESA KASIH</h1>
<p>ID 33.03.18.2008 - Kertanegara - Purbalingga</p>
</div>

<div id="list">Loading...</div>

<div class="qr-box">
<div id="qrcode"></div>
<p style="font-size:13px;line-height:1.4">Scan untuk buka info terbaru<br><b>kdkmp-kasih.github.io/kdkmp-kasih/info.html</b></p>
</div>

<script>
fetch('./data.json?t='+Date.now())
.then(r=>r.json())
.then(data=>{
  const list=document.getElementById('list');
  list.innerHTML='';
  data.reverse().forEach(item=>{
    list.innerHTML+=`
    <div class="card">
      <div style="font-size:12px;color:#6b7280">${item.tanggal}</div>
      <div style="font-weight:700;margin:4px 0">${item.judul}</div>
      <div style="font-size:14px;color:#374151;line-height:1.5">${item.isi}</div>
      <div style="margin-top:10px">
        <span class="badge harga">${item.harga}</span>
        <span class="badge stok">Stok: ${item.stok}</span>
      </div>
    </div>`;
  });
})
.catch(()=>{document.getElementById('list').innerHTML='File data.json belum di-upload';});

new QRCode(document.getElementById("qrcode"), {
  text:"https://kdkmp-kasih.github.io/kdkmp-kasih/info.html",
  width:160,
  height:160
});
</script>

</body>
</html>
